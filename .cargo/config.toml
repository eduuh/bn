# Route every rustc invocation through scripts/rustc-wrapper, which opts into a shared sccache
# compile cache and the mold linker *when they're installed*, and is a transparent no-op
# otherwise — so a checkout still builds on any machine or CI runner that lacks them. Repeat and
# parallel builds (notably `bn wt pool warm`, which builds N identical slots) then reuse one
# compile instead of redoing it N times.
[build]
rustc-wrapper = "scripts/rustc-wrapper"

# Ride out transient crates.io index/download blips in CI (default retry is 3).
# Applies to every cargo invocation, including `cargo metadata` inside the
# autogenerated release.yml `plan` job, which has no registry cache of its own.
[net]
retry = 10

# Give test threads an 8 MiB stack (matching the main thread), overriding libtest's
# 2 MiB default. Building bn's large clap command tree in an *unoptimized* debug/test
# build produces per-enum stack frames (clap-derive's generated
# `augment_subcommands`/`augment_args` allocate a distinct slot for every intermediate
# `Command`/`Arg` builder value, and slots aren't coalesced without optimization). Before
# issue #359 the flat ~100-variant `Command` enum's frame peaked at ~2.25 MiB — over the
# 2 MiB default — so any test that parses the CLI (`Cli::try_parse_from`, `Cli::command`)
# would abort with `stack overflow` the moment a new subcommand or arg tipped it over.
# #359 split `Command` into flattened `CmdGroup*` sub-enums, dropping the peak to
# ~0.87 MiB (well under 2 MiB), so this 8 MiB is now generous safety headroom rather than
# load-bearing; the `cli_tree_fits_reduced_stack` canary test enforces the 2 MiB ceiling
# so a future regrowth fails loudly. cargo injects this into the environment of the test
# binaries it spawns, so plain `cargo test --workspace` (CI + `bn verify`) picks it up.
[env]
RUST_MIN_STACK = "8388608"

# The fast inner loop. `cargo check` skips codegen and linking entirely, which is most of what a
# debug build spends its time on once bn-core is warm. Measured on this workspace, rebuilding
# after touching one bn-cli file:
#
#     cargo check --workspace     3.8 - 4.4s
#     cargo build --workspace    11.2 - 12.9s
#
# Use `cargo k` while iterating on "does this compile"; use `cargo build` only when you actually
# need to run the binary. Neither is a merge gate: clippy and the tests still decide that.
#
# `k` deliberately omits `--all-targets`. Adding it pulls in the test cfg of every crate, which
# roughly doubles the work and lands it back near `cargo build` — use `cargo ka` when you want a
# test file checked too, not by default.
[alias]
k = "check --workspace"
ka = "check --workspace --all-targets"
