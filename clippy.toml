# Tests must not mutate process-global env directly: Cargo runs a crate's tests as parallel
# threads of one process, so an unlocked `env::set_var` in one test bleeds into another mid-flight
# (order-dependent flakes). Route every mutation through `bn_core::test_support::{EnvGuard, env_lock}`
# (shared by both crates via the `test-support` feature), which serializes on a process-wide lock and
# restores prior values on drop. See issue #358. The only sanctioned raw calls carry an explicit
# `#[allow(clippy::disallowed_methods)]`: the EnvGuard impl itself, and the production flag
# propagation in `bn-cli`'s `main.rs`.
disallowed-methods = [
    { path = "std::env::set_var", reason = "use bn_core::test_support::EnvGuard/env_lock in tests (issue #358)" },
    { path = "std::env::remove_var", reason = "use bn_core::test_support::EnvGuard/env_lock in tests (issue #358)" },
]
