# bn cron manifest.
# Active [[cron]] entries are the shipped defaults used by bn cron register.
# This manifest belongs to the bn repository. Registration and execution skip every entry when bn
# is not both assigned to this machine and present in its local bare-repository inventory.
repo = "bn"
#
# Expected fields: job name, systemd OnCalendar schedule, optional booleans, and duration jitter.

[[cron]]
job = "watch"
on_calendar = "*:0/5"
persistent = false
randomized_delay = "20s"
description = "bn — wake reactor and sole owner of attention toasts: ONE batched toast for NEW blocking events (agents waiting/blocked/stuck/failed, urgent attention) via the notification policy gate; completions and warn items stay pull-only; quiet otherwise"

# Merged-worktree reclamation runs on a schedule (`wt-cleanup`, below). It touches only a worktree
# whose PR is confirmed MERGED, refuses a dirty conventional worktree, and handles a pool slot by
# committing any uncommitted work onto its branch *before* returning it, so the reset has nothing
# left to destroy. It still never evicts a working agent or a live pane.
# The rest stays MANUAL — no cron — because it can kill or delete without a merged PR behind it:
#   bn run fleet-reap — GC orphaned agent process trees + dead tmux windows
#   bn tmux-prune   — remove tmux sessions that name no repository
# Do NOT add those as [[cron]] entries.
#
# `bn tmux-snapshot-filter` is NOT this kind of reclamation, which is why it may run unattended from
# resurrect's post-save hook: it kills nothing, and only decides which sessions the saved layout
# records. The worst it can do is fail to restore a session after a reboot.
#
# The pool-slot ledger is NOT this kind of reclamation and is reconciled automatically by a
# scheduled job: it deletes no branch, removes no worktree and kills no session. It
# only makes each warm pool's `leases.json` agree with who is actually in its slots — otherwise a
# lease outlives every agent that ever held it (the recorded holder is a tmux server or login shell
# that never exits), the pool reads full, and `bn dispatch` silently spills into cold worktrees.

# --- cadence ticks --------------------------------------------------------------
# Housekeeping jobs share cadence timers where that reduces timer churn. Each tick runs its
# cluster in order via the normal `bn run` path, so every child still records its own
# `cron_run` event: `bn cron` and `bn doctor` show the same per-job rows, per-job health, and
# per-job host gating as before. A failing child never blocks its siblings, and the tick stays
# green so the child's own row is the single place a failure is reported.
#
# `persistent` / `network` on a tick are the OR of its children: the tick catches up if any child
# wants catch-up, and waits for network-online if any child touches the network.

[[cron]]
job = "tick-5m"
on_calendar = "*:0/5"
persistent = true
randomized_delay = "30s"
description = "bn — 5-minute tick: tools-reconcile (restart downed managed tools), coord-tick (queue nudges + overdue alerts), attention-sync (refresh the prefix-J attention cache), tmux-reconcile, tmux-keylog"

[[cron]]
job = "tick-10m"
on_calendar = "*:0/10"
persistent = true
randomized_delay = "2m"
network = true
description = "bn — 10-minute tick: auto-review-trigger (prepare the next queued PR when idle), attention-auto-trigger (autonomous pickup of eligible auto items), agent-supervise (stuck detection across the live fleet), forge-tick (release abandoned Forge claims, heartbeat live ones, dispatch newly assigned tasks)"

[[cron]]
job = "agent-scheduler"
on_calendar = "*:0/5"
persistent = true
network = true
description = "bn — Markdown agent scheduler: every 5 minutes load config/agents and run each due agent by name, backing off failed attempts per retry_after"

[[cron]]
job = "tick-15m"
on_calendar = "*:0/15"
persistent = true
randomized_delay = "1m"
network = true
description = "bn — 15-minute tick: main-sync (every repo has a main worktree, clean and current, and a main slot at the same commit), auto-review-poll (re-fetch active PRs, reclaim completed), cron-health (failing-cron watchdog)"

[[cron]]
job = "refresh-all"
on_calendar = "daily"
persistent = true
randomized_delay = "5m"
network = true
description = "bn — refresh all branch-note worktrees (fetch, fast-forward, rebuild)"

[[cron]]
job = "self-update"
on_calendar = "*-*-* 0/6:00:00"
persistent = true
randomized_delay = "15m"
network = true
description = "bn — reinstall the CLI when bn/main advances: install.sh --core fetches the published release (never run a stale binary)"

# There is deliberately NO release cron. Releases are built by CI on merge to main
# (.github/workflows/release.yml), never by a workstation. The `nightly-release` job that used to
# live here had each host build main and upload its own platform's assets to a rolling tag, which
# meant the published release was only as fresh as the last machine that happened to be awake —
# darwin sat two days behind linux the day this was removed. See docs/releases.md.

[[cron]]
job = "commit-notes"
on_calendar = "*-*-* 07:00:00"
persistent = true
randomized_delay = "5m"
network = true
description = "bn — commit + push branch notes"

[[cron]]
job = "daily-rollover"
on_calendar = "*-*-* 05:00:00"
persistent = true
randomized_delay = "5m"
description = "bn — roll today's daily goals forward"

[[cron]]
job = "metrics-snapshot"
on_calendar = "Mon *-*-* 06:00:00"
persistent = true
randomized_delay = "10m"
description = "bn — weekly metrics scorecard snapshot"

[[cron]]
job = "weekly-insights"
on_calendar = "Mon *-*-* 06:30:00"
persistent = true
randomized_delay = "10m"
description = "bn — weekly auto-retro: snapshot bn insights into <notes>/<machine>/insights/<YYYY-Www>.md"

[[cron]]
job = "agent-observe"
on_calendar = "*:0/30"
persistent = true
randomized_delay = "2m"
description = "bn — fold finished agent sessions into the metrics log (agent-observe)"

[[cron]]
job = "pr-observe"
on_calendar = "*:15/30"
persistent = true
randomized_delay = "2m"
network = true
description = "bn — fold my PRs' GitHub lifecycle into the metrics log as pr_opened/pr_merged/pr_closed/pr_review (pr-observe)"

[[cron]]
job = "wt-cleanup"
on_calendar = "*:5/30"
persistent = true
randomized_delay = "3m"
network = true
description = "bn — reclaim merged-PR worktrees across all repos: remove clean ones, rescue-commit then return merged pool slots, reap finished scouts (wt-cleanup)"

[[cron]]
job = "pool-warm"
on_calendar = "*-*-* 0/2:40:00"
persistent = false
randomized_delay = "5m"
network = true
description = "bn — refresh warm worktree pools for every pooled repo while the device is idle (off-peak, idle-gated + per-repo staleness); records pool_warm so bn metrics shows pool freshness"

# Repos in `[pool] scheduled` are rebuilt here at fixed times instead of by the idle sweep above:
# a full rebuild overnight, then a top-up before the workday. Not persistent: a missed 02:00 run
# should wait for 07:30, not start a multi-hour build the moment the machine wakes.
[[cron]]
job = "pool-build"
on_calendar = ["*-*-* 02:00:00", "*-*-* 07:30:00"]
persistent = false
randomized_delay = "2m"
network = true
description = "bn — rebuild the worktree pools of [pool] scheduled repos at fixed times: every worker slot reset to one freshly fetched origin/main commit, then built; reports each slot's commit and outcome, and any skip that leaves a slot unbuilt fails the run (pool-build)"

[[cron]]
job = "recall-index"
on_calendar = "*-*-* 0/3:20:00"
persistent = true
randomized_delay = "5m"
description = "bn — (re)build the local semantic-recall index (bn recall --index; incremental, offline)"

[[cron]]
job = "gather-findings"
on_calendar = "Mon..Fri *-*-* 08:15:00"
catch_up = true
persistent = true
randomized_delay = "2m"
description = "bn — gather findings (#897): snapshot the local morning-planning caches (PR review queue, your open PRs, inbound feed, stale/blocked branches, night-shift reviewables, failing crons, sentinel, quarter goals, dojo cards) into the append-only findings store, one durable run per non-empty source. Offline/additive: reuses the warm caches (no network, no re-fetch) and touches no feed/attention/daily side effect; feeds today-agent (#577)."

# Machine-global (`repo = ""`): every machine that has hosted or connected a bn tunnel, including
# build machines that do not list the bn repo. Brings Dev Tunnels and a tmux server back after a
# reboot or WSL restart with nobody signed in (linger), and keeps the one-minute watchdog alive.
# A machine with no tunnels and no signed-in devtunnel CLI exits at once; a signed-in one enrols
# itself (tunnel-auto.sh, auto-enrolment).
[[cron]]
job = "tunnel-auto"
repo = ""
on_calendar = "*:0/5"
persistent = true
network = true
description = "tunnels — keep this machine's Dev Tunnels (and a tmux server) up; restores them after a reboot with nobody signed in"
