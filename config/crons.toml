# bn cron manifest.
# Active [[cron]] entries are the shipped defaults used by bn cron register.
# Expected fields: job name, systemd OnCalendar schedule, optional booleans, and duration jitter.

[[cron]]
job = "watch"
on_calendar = "*:0/5"
persistent = false
randomized_delay = "20s"
description = "bn — wake reactor and sole owner of attention toasts: ONE batched toast for NEW blocking events (agents waiting/blocked/stuck/failed, urgent attention) via the notification policy gate; completions and warn items stay pull-only; quiet otherwise"

# Worktree/branch/session reclamation is intentionally MANUAL — no cron.
# The `wt-cleanup` and `fleet-reap` crons were removed so automated reclamation can never delete
# a branch, remove a worktree, or kill a tmux session out from under active work. The jobs still
# exist for on-demand use; run cleanup by hand when you actually want it:
#   bn wt cleanup   — reclaim worktrees whose PR merged (local + remote branch)
#   bn wt reap      — remove finished/clean scout worktrees
#   bn run fleet-reap — GC orphaned agent process trees + dead tmux windows
# Do NOT re-add these as [[cron]] entries.
#
# The pool-slot ledger is NOT this kind of reclamation and is reconciled automatically, at the head
# of every `queue-tick` pass: it deletes no branch, removes no worktree and kills no session. It
# only makes each warm pool's `leases.json` agree with who is actually in its slots — otherwise a
# lease outlives every agent that ever held it (the recorded holder is a tmux server or login shell
# that never exits), the pool reads full, and `bn dispatch` silently spills into cold worktrees.

# --- cadence ticks --------------------------------------------------------------
# Housekeeping jobs share cadence timers where that reduces timer churn. Each tick runs its
# cluster in order via the normal `bn run` path, so every child still records its own
# `cron_run` event: `bn cron` and `bn doctor` show the same per-job rows, per-job health, and
# per-job host gating as before. A failing child never blocks its siblings, and the tick stays
# green so the child's own row is the single place a failure is reported.
#
# `persistent` / `network` on a tick are the OR of its children: the tick catches up if any child
# wants catch-up, and waits for network-online if any child touches the network.

[[cron]]
job = "tick-5m"
on_calendar = "*:0/5"
persistent = true
randomized_delay = "30s"
description = "bn — 5-minute tick: tools-reconcile (restart downed managed tools), routine-tick (personal schedule coach), attention-sync (refresh the prefix-J attention cache)"

[[cron]]
job = "tick-10m"
on_calendar = "*:0/10"
persistent = true
randomized_delay = "2m"
network = true
description = "bn — 10-minute tick: auto-review-trigger (prepare the next queued PR when idle), attention-auto-trigger (autonomous pickup of eligible auto items), agent-supervise (stuck detection across the live fleet)"

[[cron]]
job = "agent-scheduler"
on_calendar = "*:0/5"
persistent = true
network = true
description = "bn — common Markdown agent scheduler: every 5 minutes strictly load config/agents, run each due agent by name, catch up missed slots, and back off failed attempts per retry_after"

[[cron]]
job = "tick-15m"
on_calendar = "*:0/15"
persistent = true
randomized_delay = "1m"
network = true
description = "bn — 15-minute tick: auto-review-poll (re-fetch active PRs, reclaim completed), cron-health (failing-cron watchdog)"

[[cron]]
job = "refresh-all"
on_calendar = "daily"
persistent = true
randomized_delay = "5m"
network = true
description = "bn — refresh all branch-note worktrees (fetch, fast-forward, rebuild)"

[[cron]]
job = "self-update"
on_calendar = "*-*-* 0/6:00:00"
persistent = true
randomized_delay = "15m"
network = true
description = "bn — rebuild + reinstall the CLI when bn/main advances (never run a stale binary)"

[[cron]]
job = "nightly-release"
on_calendar = "*-*-* 0/6:00:00"
persistent = true
randomized_delay = "20m"
network = true
only_on = ["mac.lan", "fedora"]
description = "bn — build main and publish this machine's platform binaries to the rolling `nightly` prerelease (build + workspace tests must pass first). Per-target asset names, so the darwin and linux hosts fill the same release side by side."

[[cron]]
job = "commit-notes"
on_calendar = "*-*-* 07:00:00"
persistent = true
randomized_delay = "5m"
network = true
description = "bn — commit + push branch notes"

[[cron]]
job = "daily-rollover"
on_calendar = "*-*-* 05:00:00"
persistent = true
randomized_delay = "5m"
description = "bn — roll today's daily goals forward"

[[cron]]
job = "metrics-snapshot"
on_calendar = "Mon *-*-* 06:00:00"
persistent = true
randomized_delay = "10m"
description = "bn — weekly metrics scorecard snapshot"

[[cron]]
job = "weekly-insights"
on_calendar = "Mon *-*-* 06:30:00"
persistent = true
randomized_delay = "10m"
description = "bn — weekly auto-retro: snapshot bn insights into <notes>/<machine>/insights/<YYYY-Www>.md"

[[cron]]
job = "dojo-cards"
on_calendar = "*-*-* 03:30:00"
persistent = true
randomized_delay = "10m"
description = "bn — mine new bn dojo cards from recent fix:/feat: commits + module tree (dojo-cards)"

[[cron]]
job = "agent-observe"
on_calendar = "*:0/30"
persistent = true
randomized_delay = "2m"
description = "bn — fold finished agent sessions into the metrics log (agent-observe)"

[[cron]]
job = "pr-observe"
on_calendar = "*:15/30"
persistent = true
randomized_delay = "2m"
network = true
description = "bn — fold my PRs' GitHub lifecycle into the metrics log as pr_opened/pr_merged/pr_closed/pr_review (pr-observe)"

[[cron]]
job = "keep-warm"
on_calendar = "*:5/10"
persistent = false
randomized_delay = "1m"
network = true
description = "bn — brainstorm enhancement issues for owned orchestrate repos when truly dry (opt-in; [orchestrate].keep_warm + own). Issue->work refill was superseded by `bn task pull` in #1001; this arm now only reports the deficit."

[[cron]]
job = "pool-warm"
on_calendar = "*-*-* 0/2:40:00"
persistent = false
randomized_delay = "5m"
network = true
description = "bn — refresh warm worktree pools for every pooled repo while the device is idle (off-peak, idle-gated + per-repo staleness); records pool_warm so bn metrics shows pool freshness"

[[cron]]
job = "night-shift"
on_calendar = "*-*-* 23:15:00"
persistent = true
randomized_delay = "10m"
network = true
description = "bn — the night shift: dispatch promoted todos into worktrees + agents (opt-in; no-ops unless [night] enabled + repos allowlisted + kill switch clear)"

[[cron]]
job = "recall-index"
on_calendar = "*-*-* 0/3:20:00"
persistent = true
randomized_delay = "5m"
description = "bn — (re)build the local semantic-recall index (bn recall --index; incremental, offline)"

[[cron]]
job = "gather-findings"
on_calendar = "Mon..Fri *-*-* 08:15:00"
catch_up = true
persistent = true
randomized_delay = "2m"
description = "bn — gather findings (#897): snapshot the local morning-planning caches (PR review queue, your open PRs, inbound feed, stale/blocked branches, night-shift reviewables, failing crons, sentinel, quarter goals, dojo cards) into the append-only findings store, one durable run per non-empty source. Offline/additive: reuses the warm caches (no network, no re-fetch) and touches no feed/attention/daily side effect; feeds today-agent (#577)."

[[cron]]
job = "staff-archive"
on_calendar = "Sun *-*-* 04:00:00"
persistent = true
randomized_delay = "30m"
description = "bn — staff store retention (#275): compact fully-elapsed quarters of feed cards into a per-quarter headline index and roll up staff_run ledger rows older than a year into monthly aggregates; chronicles + retro transcripts exempt (idempotent, safe to miss)"

[[cron]]
job = "queue-tick"
on_calendar = "*:0/1"
persistent = true
description = "bn — queue tick: drain the machine-wide work queue in priority order, starting only what there is capacity and a capable node for. Records why on every pass (`bn queue why`), including the passes that start nothing. Honours `bn queue pause`."
