# bn configuration.
# Sensible defaults are active below. Machine/user-specific keys (paths, hostnames,
# repos, nodes) stay commented — uncomment and fill them to opt in.
# Precedence: defaults -> config.toml -> legacy files -> BN_* env vars.

# worktree_dir = "/home/you/projects/worktree"  # absolute path; default ~/projects/worktree
# hostname = "my-laptop"                         # default auto-detected

[harness]
# default = "claude"             # copilot | claude; preferred harness every launcher uses when
#                                # nothing is requested (bn control start, dispatch, staff, …).
#                                # Also settable via $BN_HARNESS. Unset/unavailable → copilot.
# disabled = ["claude"]          # harnesses turned off on this box (e.g. Claude org-disabled).
#                                # Copilot is the guaranteed fallback and can't be disabled.

[personal]
# notes_root = "/home/you/projects/branch-notes"  # absolute path; default ~/projects/branch-notes

[work]
# notes_root = "/home/you/projects/notes/bn"  # absolute path; default ~/projects/notes/bn
# work_repos = ["acme", "internal-tool"]      # repo names; default none
# only = true                                 # default false

[review]
weekly_anchor = "monday"        # weekday name or 0=Sun..6=Sat
sla_first_review_hours = 4
sla_merge_hours = 24
# harness = "copilot"           # copilot | claude; default current harness, then copilot

# Per-stage pipeline policy, keyed by stage name. Everything is left to the harness default
# (latest) until you pin it. Layering, low → high: built-in default → [pipeline.stages.<stage>] →
# [repo.<name>.pipeline.stages.<stage>]. Omitted fields inherit, so a repo entry can override only
# the model and keep the global effort/harness.
#
# `harness` (claude | copilot) picks the agent for a dispatch LAUNCHED at that stage — it's the
# stage-aware default when `--agent` isn't pinned (an explicit `--agent` still wins). A single
# dispatched run uses one harness for its whole pipeline, so this only differs across separate
# dispatches (a `--skill plan` pass vs an execute pass), not mid-run. Only investigate/plan/execute
# (and critique via `bn critic`) are reachable launch stages.
#
# `stages` was called `models` before per-stage policy grew beyond model selection; the old name is
# still accepted. Don't write both — a file carrying both tables is rejected as malformed rather
# than silently merged.
# [pipeline.stages.investigate]
# model = "gpt-5.4"
# effort = "high"               # effort tier
# [pipeline.stages.plan]
# model = "claude-fable-5"
# effort = "max"
# harness = "claude"            # fable runs only under the claude harness
# [pipeline.stages.execute]
# model = "claude-opus-4.8"
# effort = "max"
# harness = "copilot"           # executors run copilot + opus
# [pipeline.stages.critique]
# model = "gpt-5.4"
# effort = "high"
# [repo.my-repo.pipeline.stages.execute]
# model = "claude-sonnet-4.6"   # inherits omitted fields (harness too)

[attention]
max_age_hours = 24              # widened over weekends

[calib]
s = "30m"
m = "90m"
l = "3h"

[wrap]
enabled = false

[standup]
enabled = false
fetch_delta = false

[dxi]
enabled = false

[night]
enabled = false
max_dispatch = 3
window = "23:00-06:00"          # local HH:MM-HH:MM
repos = []                      # repo allowlist; empty disables

[sentinel]
todo_age_days = 30
# repos = ["bn"]                # repo allowlist; default [night].repos

[quarter]
enabled = false
review_window_days = 7
# Override the shipped schedule with a higher-precedence agents/quarter-review.md manifest.
# harness = "copilot"                 # default [review].harness, then copilot

[dojo]
enabled = false
daily_target = 5
# repos = ["bn"]                # rotation allowlist; default all repos with cards

[chief]
enabled = false
# am_time = "05:30"             # local HH:MM; timer-owned default
# pm_time = "16:45"             # local HH:MM; timer-owned default

[archivist]
enabled = false
time = "17:30"                  # local HH:MM Friday chronicle time

[retro]
enabled = false

[mentor]
enabled = false

[eye]
enabled = false
review_interval_months = 12     # 6..12 months
# last_review = "2026-01-15"    # YYYY-MM-DD; optional baseline

[routine]
enabled = false
timezone = "local"              # IANA zone or local
reminder_minutes_before = 10
notify_on_start = true
catchup_horizon_minutes = 30
# [[routine.blocks]]
# name = "Deep work"
# id = "deep-work"
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "09:00"
# end = "12:30"
# kind = "work"                 # work | learning | family | recovery | exercise | sleep

# Desktop-notification policy. A toast means work has STOPPED and needs your decision;
# completions and lifecycle narration stay pull-only in `bn next` / `bn attn` / the tmux badges.
# `bn notify status` shows what was held back and why. Nothing configured here is ever lost —
# the underlying items stay on the pull surfaces regardless.
[notify]
enabled = true
bar = "blocking"                # blocking (default) | completion | all
cooldown_mins = 30              # a still-true condition re-pings at most this often
daily_budget = 12               # past it, only first-ever keys still land
source_budget = 4               # one source's share of that budget

[today]
enabled = false

# [tools]
# builtins = ["n8n"]            # managed tool names; default none

# [staff]
# home = "my-laptop"            # host name; default runs anywhere
# mail = ["standup"]            # agents whose card is drafted to email as soon as it lands.
#                               # Delivery follows the card (no second timer), so a brief is never
#                               # mailed before it exists. Needs a Gmail app password in the
#                               # keychain — without one it says so and leaves the card in the feed:
#                               #   security add-generic-password -s bn-gmail -a you@gmail.com -w '<app password>'
#                               # Default empty: a card leaving the machine is opt-in per agent.

