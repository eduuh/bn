#============================================================================
# tmux-modern.conf — settings that require tmux ≥ 3.4
#
# Sourced conditionally from tmux.conf via a version gate, so the main config
# stays loadable on older tmux (e.g. Ubuntu's 3.2a). Everything here applies
# globally, so it decorates every display-popup without touching the bindings.
#============================================================================

# Rounded, subtly-bordered popups (note / capture / lazygit / scratch / pickers).
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour238"
set -g popup-style "bg=default"

# Menus (choose-tree, choose-buffer, confirm prompts) get the same treatment.
set -g menu-border-lines rounded
set -g menu-border-style "fg=colour238"
set -g menu-selected-style "bg=cyan,fg=black"
