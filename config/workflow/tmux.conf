#============================================================================
# TMUX CONFIGURATION
#============================================================================

#----------------------------------------------------------------------------
# Core Settings
#----------------------------------------------------------------------------

# Terminal & colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -gq allow-passthrough off

# Shell
if-shell '[ -x /bin/zsh ]' 'set-option -g default-shell /bin/zsh'

# History
set -g history-limit 100000

# Timing
set -s escape-time 0
set -g display-panes-time 2000

# Extended keys — distinguish C-BSpace, C-Enter, etc. from their base keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys,*-kitty:extkeys,*-ghostty:extkeys'

# Mouse
set -g mouse on

# Focus events — let nvim see focus gained/lost (autoread, autosave, gitsigns refresh)
set -g focus-events on

# Multi-client: resize to the smallest *attached* client only; stay attached
# (switch to another session) when the current session is destroyed.
set -g aggressive-resize on
set -g detach-on-destroy off

# Window/pane numbering (start at 1)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Disable visual noise
set -g visual-activity off
set -g visual-bell off

#----------------------------------------------------------------------------
# Prefix & Core Bindings
#----------------------------------------------------------------------------

# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind R source-file ~/.tmux.conf \; display "Config reloaded!"

# Curated keybinding cheat-sheet (overrides the default list-keys dump)
bind ? display-popup -E -w 70% -h 90% "exec $SHELL -c '$HOME/.config/bn/bn tmux-help'"

# Clean up bindings that were removed (so reload re-applies cleanly)
unbind S
unbind J
unbind c
unbind C
unbind C-n
unbind C-s
unbind W
unbind N
unbind y
unbind k
unbind a
unbind `
unbind i
unbind C-r
unbind C-w
unbind 0
set-hook -gu after-new-window
set-hook -gu window-renamed

#----------------------------------------------------------------------------
# Pane Management
#----------------------------------------------------------------------------

# Splits (v=right, s=below) - keeps current path
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane navigation (arrow keys)
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# Pane resizing (shift + arrow)
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Kill pane (with confirm)
bind q confirm-before -p "Kill pane? (y/n)" kill-pane

# Toggle zoom
bind z resize-pane -Z

# Reshape: break this pane into its own window (!), or pull another window's
# pane in beside this one (@).
bind ! break-pane
bind @ choose-window 'join-pane -h -s "%%"'

#----------------------------------------------------------------------------
# Window Management
#----------------------------------------------------------------------------

# New window (keeps path)
bind w new-window -c "#{pane_current_path}"

# Rename window
bind r command-prompt -p "Rename:" "rename-window '%%'"

# Direct window access
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5

# Previous/next window
bind -r [ previous-window
bind -r ] next-window

# Cycle to next window (no prefix)
bind -n C-BSpace next-window

# Move windows left/right
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Watch this window for completion. Toggling on sets monitor-silence: when the
# window's output goes quiet for 12s (build/test/agent finished), the
# alert-silence hook below badges it with a ✓ (@bn_done) and stops watching.
bind m if -F '#{monitor-silence}' \
  'setw monitor-silence 0 ; setw @bn_done "" ; display "watch off"' \
  'setw monitor-silence 12 ; setw @bn_done "" ; display "watching — quiet 12s = done"'

# When a watched window goes quiet, badge it ✓ and stop watching.
set-hook -g alert-silence 'run-shell "$HOME/.config/bn/bn tmux-done-badge #{hook_window}"'

#----------------------------------------------------------------------------
# Session Management
#----------------------------------------------------------------------------

# Project picker (`bn tat`, native fzf + preview). Popups run via `exec $SHELL -c`
# (non-interactive, so startup is instant) which sources .zshenv — that puts
# fzf/bn/zoxide/nvim on PATH (they live in ~/.local/bin and ~/.bin, which the tmux
# server's PATH lacks). `bn` resolves through ~/.config/bn/bn (a symlink install.sh
# points at the installed binary). Same pattern for every native popup below.
bind C-o display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat'"

# Same picker, scoped to the Windows-filesystem repos (WSL drives them; root from
# ~/.config/wt/win-root). C-w = "windows" repos; prefix C-p is the planning session.
bind C-w display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat --root win'"

# Kill session and switch to next
bind t run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'

# Rename current session
bind . command-prompt -p "Rename session:" "rename-session '%%'"

# Jump to the persistent planning / orchestration session (created if absent).
# C-p pairs with the C-o / C-w picker family ("P for Planning"). The session always
# starts in the personal-notes repo so planning lands next to the notes.
bind C-p run-shell 'tmux has-session -t planning 2>/dev/null || tmux new-session -d -s planning -c "$HOME/projects/personal-notes"; tmux switch-client -t planning'

# Prefix + Backspace is a second, muscle-memory-friendly chord for the same jump.
bind BSpace run-shell 'tmux has-session -t planning 2>/dev/null || tmux new-session -d -s planning -c "$HOME/projects/personal-notes"; tmux switch-client -t planning'

# Bring up the orchestrator cockpit (#647): ensure the planning-session grounding cockpit
# (read-only backlog/todos/attention view), then follow in. Shift-P, next to C-p.
bind P run-shell 'exec $SHELL -c "$HOME/.config/bn/bn orchestrate cockpit up --attach"'

# Always keep a 'planning' session for planning + orchestration. Created when the config is
# first sourced (server start); the guard avoids re-creating it on reload. Rooted in the
# personal-notes repo; tmux falls back to $HOME if that path is absent (fresh machine).
if-shell 'tmux has-session -t planning 2>/dev/null' '' 'new-session -d -s planning -c "~/projects/personal-notes"'

#----------------------------------------------------------------------------
# Worktree Workflow (windows = worktrees)
#----------------------------------------------------------------------------

# Open worktree as window, or create it from latest main if the typed name is new.
# `-d pane_current_path` so `bn wt` resolves the current repo from cwd.
bind o display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt open'"

# Always open a new window on a chosen worktree (never re-selects existing)
bind W display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt open --new'"

# Close all panes — kill the whole window (the bigger hammer next to q = kill pane)
bind X confirm-before -p "Close window (all panes)? (y/n)" kill-window

# Pick any worktree to remove it + kill its window
bind D display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt remove'"

# Branch note popup
bind n display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'"

# Quick-capture: add a todo (a) / blocker (b) without leaving the pane. The popup runs in
# the pane's cwd so bn resolves the note and refreshes the window decoration live.
bind a display-popup -E -w 60% -h 20% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn add todo --prompt'"
bind b display-popup -E -w 60% -h 20% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn add blocker --prompt'"

# Attention queue: native interactive fzf picker — `bn doctor --pick` (cron failures + raised
# items + stale notes, urgent first). ↵ opens the item · ctrl-g starts its agent · ctrl-a ack ·
# ctrl-s snooze 1d · ctrl-r reload. Ported from bn-attention.sh, extending the `bn wt` native
# fzf+dispatch pattern.
bind C-a display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn doctor --pick'"

# Briefings: the staff's cards in one fzf popup (#265) — the sibling of prefix C-a. Cards
# unread-first / newest-first. ↵ renders the focused card + marks it read · ctrl-u/ctrl-d
# up/down-rate it (#268) · m marks read · ctrl-o opens its link · ctrl-r reloads. Read-marks
# round-trip through `bn staff feed`, so tmux and the nvim cockpit agree on what's unread. `B`
# (Shift-b) — lowercase `b` is the blocker quick-capture.
bind B display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn staff feed --pick'"

# Agent cockpit. Both go through `bn agent launch` (native, ported from workflow/bin/agent):
# resume the worktree's recorded session if one exists, else start fresh — copilot by default. Auto-watched, badges ✓ when a
# window goes quiet. Run several across worktrees in parallel.
# A — spawn an agent window on this worktree (copilot, the default agent).
bind A run-shell "$HOME/.config/bn/repo/config/workflow/bin/tmux-agent.sh '#{pane_current_path}'"
# G — same, passing copilot explicitly (claude is still available: `bn agent launch claude`).
bind G run-shell "$HOME/.config/bn/repo/config/workflow/bin/tmux-agent.sh '#{pane_current_path}' copilot"
# S — orchestration roll-up: in-flight (watched/done) windows across all sessions + bn summary.
bind S display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-cockpit'"
# j — the attention list: the native fzf picker (cron failures + raised items + stale
#     notes, urgent first), same as `prefix C-a`. ↵ opens the item · ctrl-g starts its
#     agent · ctrl-a ack · ctrl-s snooze 1d · ctrl-r reload. Window-jumping stays on
#     `prefix Tab` (`bn jump --next`) and `prefix f` (fleet pick).
bind j display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn doctor --pick'"
# Tab — fast-path: jump straight to the top-priority window needing you, no popup. Repeated
#       presses cycle through them (the one you land on drops out next time). Native
#       `bn jump --next`, ported from tmux-jump.sh.
bind Tab run-shell "$HOME/.config/bn/bn jump --next"
# f — the whole fleet in ONE picker: every live agent window across all sessions AND the
#     orchestrator cockpit (planning), each with a live `capture-pane` preview. ↵ jumps focus to
#     the highlighted window (switch-client). The interactive jump companion to `bn fleet` (the
#     read-only board); where `j` lists only what NEEDS you, `f` lists them ALL. Native
#     `bn fleet pick` (#347).
bind f display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn fleet pick'"

#----------------------------------------------------------------------------
# Nested tmux (remote hosts / codespaces / devcontainers)
#----------------------------------------------------------------------------

# `bn connect --window <alias>` creates a local `host:<alias>` session whose pane owns an SSH
# attachment to the remote `bn` tmux. Hide the outer chrome and move that session onto the empty
# `off` key table so the remote tmux receives C-Space and every other key directly. F12 is the one
# escape hatch: switch back to the previously attached cockpit session, whose hook restores the
# configured two-row status and normal root key table.
set-hook -g client-session-changed 'if -F "#{m:host:*,#{session_name}}" "set -g status off ; set key-table off" "set -g status 2 ; set -u key-table"'
if -F '#{m:host:*,#{session_name}}' 'set -g status off ; set key-table off' 'set -g status 2 ; set -u key-table'
bind -T off F12 switch-client -l

# F9 = passthrough toggle for nesting. When you SSH into a codespace that also
# runs tmux, both servers grab C-Space and the outer one wins — the inner tmux
# never sees its prefix. F9 tells THIS (outer/parent) tmux to stop handling keys:
# prefix is unset and the root table is swapped for an empty "off" table, so every
# keystroke (C-Space included) falls through to the inner tmux. The window-list
# bar turns dark red with an OFF badge as a reminder. F9 again restores control.
#
# One bare key, both directions — no prefix (the collision we're dodging) and no
# Alt (not all keyboards/terminals send it). F9 chosen over F12 (browser DevTools)
# and F5/F11 (browser reload/fullscreen), which web codespaces intercept.
bind -T root F9 \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=colour52,fg=colour250" \;\
  set status-right "#[fg=colour250,bg=colour124,bold] OFF " \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F9 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-right \;\
  refresh-client -S

#----------------------------------------------------------------------------
# Copy Mode (vi-style)
#----------------------------------------------------------------------------

setw -g mode-keys vi

# Enter copy mode
bind Space copy-mode

# Selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Navigation
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

# Search
bind -T copy-mode-vi / command-prompt -p "/" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "?" "send -X search-backward '%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

# OSC52: copy reaches the real clipboard through the terminal — works over SSH and
# in WSL with no X server. The copy-pipe bindings below still set the tmux buffer,
# which triggers OSC52; the local pbcopy/xclip pipe is kept as a same-host fallback.
set -g set-clipboard on

# System clipboard (platform-specific)
if-shell 'uname | grep -qi darwin' \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Paste
bind p paste-buffer
bind P choose-buffer

#----------------------------------------------------------------------------
# Status Line
#----------------------------------------------------------------------------

# Palette — Tokyo Night (truecolor; `terminal-overrides ",*:RGB"` above makes these exact).
# Inlined as hex throughout this section (tmux can't share variables into style strings).
# Legend so a future edit keeps the bar coherent:
#   bg seg #1f2335 · divider #3b4261 · text #c0caf5 · dim #565f89
#   blue #7aa2f7 (active/branch) · cyan #7dcfff (panes/cron) · green #9ece6a (clean/done)
#   amber #e0af68 (todos/waiting) · red #f7768e (blocker/dirty) · purple #bb9af7 (goal)
# Powerline separators below are   (U+E0B0/E0B2) — they need a Nerd/powerline-patched
# font. If you see tofu boxes, swap them for plain spaces or '│'.

set -g status-interval 5
set -g status-style "bg=default,fg=#c0caf5"

#--- Pane borders --------------------------------------------------------------
# Top border doubles as a per-pane label: host · index:command, a zoom flag, and the path tail —
# so every pane self-documents (which machine, which command, where) without checking the bar.
# The host (#h) earns its place across machines: attach a remote host's tmux via `bn connect` and
# its panes report THAT remote host, not this laptop — so you never act on the wrong box. Always
# on (top) so the host stays visible even on a single, full-screen pane. Safe to live on the pane
# border now that the dashboard moved to a real (full-width) status line: genuinely per-pane, not
# a duplicated bar.
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "#[fg=#{?pane_active,#7dcfff,#3b4261}]┄ #[fg=#{?pane_active,#7aa2f7,#565f89},bold]#h#[nobold] #[fg=#3b4261]· #[fg=#{?pane_active,#c0caf5,#565f89},bold]#P#[nobold]:#{pane_current_command}#{?window_zoomed_flag,#[fg=#e0af68]  ,} #[fg=#3b4261]#{b:pane_current_path} ┄"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"

#--- Top: two-row status line (dashboard + tabs) -------------------------------
# tmux can place status lines on only ONE side, so to get a single full-width bar that
# never splits we stack BOTH rows at the top:
#   • row 0 = context dashboard — 📮goal (left) · git state · cron · work tally · attention · clock (right).
#   • row 1 = window tabs (+ session pill), the usual list with click ranges.
# Both span the full width regardless of how panes are split underneath.
set -g status on
set -g status 2
set -g status-position top
set -g status-justify left
set -g status-right ""
# Row 0 — dashboard. #(...) run for the active pane (its #{pane_current_path}).
# Left cluster (goal/PR title · staff feed) flat on the default bg. Right cluster rides one #1f2335
# segment with powerline caps: git · cron · the focused branch's live work tally · clock · date, then attention trails on the far right after the date (attention is the last thing on the row).
# That tally — `bn tmux-status`, amber " [n] [n]" — is recomputed each status-interval,
# so it tracks the active branch even when its window tab hasn't been touched. The per-window
# tab badges (@bn_todos/@bn_blockers, row 1) are lazy — only written when bn mutates that
# window's note — so this is the surface that always answers "what's left / what's blocked?".
# 📮N (#265) trails the goal/PR title — unread staff briefing cards; hides during a `bn focus` block
# and when nothing's unread, so silence is the default state (prefix-B opens the briefing popup).
set -g status-format[0] "#[align=left,bg=default]#($HOME/.config/bn/bn tmux-goal '#{pane_current_path}' 2>/dev/null) #[fg=#7aa2f7]#($HOME/.config/bn/bn pipeline badge '#{pane_current_path}' 2>/dev/null)#[fg=default] #($HOME/.config/bn/bn staff feed --badge 2>/dev/null)#[align=right,bg=default]#[fg=#1f2335,bg=default]#[fg=#c0caf5,bg=#1f2335] #($HOME/.config/bn/bn tmux-git '#{pane_current_path}' 2>/dev/null) #[fg=#3b4261]│ #[fg=#565f89]#($HOME/.config/bn/bn cron running 2>/dev/null)#[fg=#565f89] #[fg=#e0af68,bg=#1f2335]#($HOME/.config/bn/bn tmux-status '#{pane_current_path}' 2>/dev/null) #[fg=#3b4261]│ #($HOME/.config/bn/bn tmux-mcp badge 2>/dev/null) #[fg=#3b4261]│ #[fg=#a9b1d6]%H:%M #[fg=#565f89]%a %d #($HOME/.config/bn/bn attn badge 2>/dev/null)"
# Row 1 — session pill + window tabs, reusing status-left / window-status-*-format below.
# range=window|#{window_index} keeps the per-tab click targets (#{mouse_window}) working.
set -g status-format[1] "#[align=left]#{T:status-left}#[list=on align=#{status-justify}]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index}]#{T:window-status-current-format}#[norange]#{?window_end_flag,,#{window-status-separator}}}"
# Left pill = session name, flips to reverse-video " PREFIX " while C-Space is held —
# so you always know whether tmux is listening.
set -g status-left "#[fg=#1a1b26,bg=#{?client_prefix,#e0af68,#7aa2f7},bold]  #{?client_prefix,PREFIX,#S} #[fg=#{?client_prefix,#e0af68,#7aa2f7},bg=default,nobold] "
# Tabs show just the branch name + bn badges. Decoration is set as per-window options
# by `bn tmux sync` (after bn add/done): @bn_blockers (red  badge) · @bn_todos ( count).
# Trailing activity badge — @bn_agent (Claude Code hooks): waiting () needs input ·
# working () · done (); takes precedence over @bn_done (the silence-watch
# fallback, see `bind m`). Active tab = solid blue powerline pill (dark text); inactive =
# flat dim — the contrast carries "where am I" at a glance.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=default] #I #[fg=#737aa2]#W#{?@bn_blockers,#[fg=#f7768e] #{@bn_blockers},}#{?@bn_todos,#[fg=#565f89] #{@bn_todos},}#{?#{==:#{@bn_agent},waiting},#[fg=#e0af68] ,#{?#{==:#{@bn_agent},working},#[fg=#565f89] ,#{?#{==:#{@bn_agent},done},#[fg=#9ece6a] ,#{?@bn_done,#[fg=#9ece6a] ,}}}} "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W#{?@bn_blockers,#[fg=#3b1a22] #{@bn_blockers},}#{?@bn_todos,#[fg=#2a3158] #{@bn_todos},}#{?#{==:#{@bn_agent},waiting},#[fg=#7a5a10] ,#{?#{==:#{@bn_agent},working},#[fg=#3a4068] ,#{?#{==:#{@bn_agent},done},#[fg=#1e3a14] ,#{?@bn_done,#[fg=#1e3a14] ,}}}} #[fg=#7aa2f7,bg=default,nobold]"

#--- Tab right-click / double-click → action menu ------------------------------
# Anchored to the status line (-y S) so it opens UPWARD, above the cursor — otherwise the
# button-release lands on a menu item and dismisses it instantly. Targets the CLICKED tab
# via -t "#{mouse_window}", so each item acts on that window. Reuses the keyboard actions
# (n note · g lazygit · r rename · m watch · X kill). Both gestures bound since some
# terminals swallow right-click (e.g. paste-on-right-click); double-click always reaches us.
bind -n MouseDown3Status   display-menu -x M -y S -t "#{mouse_window}" -T "#[align=centre,fg=white,bold] #{window_name} " "Open note" n { display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'" } "Lazygit" g { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'" } "Rename window" r { command-prompt -I "#{window_name}" -p "Rename:" "rename-window -t '#{mouse_window}' '%%'" } "Watch for done" m { setw -t "#{mouse_window}" monitor-silence 12 ; setw -t "#{mouse_window}" @bn_done "" ; display "watching #{window_name}" } "" "Kill window" X { confirm-before -p "Kill #{window_name}? (y/n)" "kill-window -t '#{mouse_window}'" }
bind -n DoubleClick1Status display-menu -x M -y S -t "#{mouse_window}" -T "#[align=centre,fg=white,bold] #{window_name} " "Open note" n { display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'" } "Lazygit" g { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'" } "Rename window" r { command-prompt -I "#{window_name}" -p "Rename:" "rename-window -t '#{mouse_window}' '%%'" } "Watch for done" m { setw -t "#{mouse_window}" monitor-silence 12 ; setw -t "#{mouse_window}" @bn_done "" ; display "watching #{window_name}" } "" "Kill window" X { confirm-before -p "Kill #{window_name}? (y/n)" "kill-window -t '#{mouse_window}'" }

# Messages
set -g message-style "bg=default,fg=yellow"

#----------------------------------------------------------------------------
# Popups & Tools
#----------------------------------------------------------------------------

# Editor popup (nvim) — opens nvim directly at this worktree's cwd (no persistent
# session, no nested tmux). Close with :q. Same popup shape as the note bind below.
bind e display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c 'nvim .'"

# Plan-review popup — open the newest pending plan in nvim (edit + save-back), then approve /
# request-changes. Mirrors the `e` editor popup; `bn review edit` picks the newest open review.
bind E display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c 'bn review edit'"

# Lazygit
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'"

# Scratch shell — throwaway terminal in the current worktree, vanishes on exit.
bind Enter display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "exec $SHELL"

#----------------------------------------------------------------------------
# Plugins — vendored in-repo, no TPM
#----------------------------------------------------------------------------
# tmux-resurrect + tmux-continuum live under config/workflow/plugins/ (committed copies, see
# config/workflow/plugins/README.md). We source their entrypoints directly instead of running TPM,
# so a fresh machine needs no plugin manager and no network fetch — the config is fully
# self-contained. resurrect.tmux registers its own save/restore script paths as tmux options,
# which continuum then reads, so order (resurrect before continuum) is all that matters.

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'   # restore nvim via its own Session.vim

# Continuum: auto-save every 15 min, auto-restore the layout on server start.
# The session-per-project / window-per-worktree layout (cwds + running programs)
# comes back after a reboot. The nvim/note popups run nvim directly (no session),
# so there's nothing extra to restore for them.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Save immediately when a session or window is destroyed. Continuum's periodic
# auto-save is driven by a #() interpolation in status-right, so it only fires
# while the status line is ticking — on WSL that stalls whenever the instance
# suspends, leaving the snapshot hours stale. A deletion done just before a
# suspend/reboot would otherwise be lost, and auto-restore would resurrect the
# session you just killed. These hooks capture the new state the moment it
# changes, so restore always replays what you actually left behind.
set-hook -g session-closed  'run-shell -b "~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g window-unlinked 'run-shell -b "~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/scripts/save.sh quiet"'

# Keep the HTTP MCP endpoint available before newly opened agent panes need it. The Rust command
# checks the configured opt-out and loopback port first, so repeated create/attach hooks are cheap
# and never launch another process while the managed service is already reachable.
set-hook -g session-created 'run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"'
set-hook -g client-attached 'run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"'

# Version-gated extras: popup borders/titles need tmux ≥ 3.4. Sourced only when the
# running server is new enough, so this config stays clean on 3.2a (unknown-option
# errors would otherwise abort the reload). Activates automatically after the 3.5a
# upgrade (see ensure_tmux_version in dotfiles).
if-shell '[ "$(tmux -V | sed -n "s/^tmux \([0-9.]*\).*/\1/p")" = "$(printf "%s\n3.4" "$(tmux -V | sed -n "s/^tmux \([0-9.]*\).*/\1/p")" | sort -V | tail -1)" ]' \
  'source-file ~/.config/bn/repo/config/workflow/tmux-modern.conf'

# Load the vendored plugins directly (keep at bottom). resurrect first so its option-registered
# save/restore script paths are set before continuum reads them. Paths resolve through the
# repo anchor (~/.config/bn/repo → the bn checkout), so this works wherever bn is installed.
run-shell '~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/resurrect.tmux'
run-shell '~/.config/bn/repo/config/workflow/plugins/tmux-continuum/continuum.tmux'

# Guarantee the bn-web dashboard/MCP server is up the moment the tmux server boots. This is the
# same canonical "server just booted" signal used for `bn startup` below: the session-created /
# client-attached hooks above only cover later sessions and attaches, and a headless
# `tmux start-server` (no first session) would otherwise boot with nothing ensuring the service —
# the top-level run-shell is the one event that fires exactly once at server start on tmux 3.5a.
# `bn tmux-mcp ensure` is gated on web.tmux_mcp_autostart and a loopback port probe, so it's a
# cheap no-op when the managed service is already reachable, and `-b` keeps a slow launch from
# blocking startup.
run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"

# One boot signal for the info agents' startup trigger. tmux sources this config exactly once,
# when the server is created (there is no server-started hook in tmux 3.5a, and attach/session
# hooks would fire repeatedly), so a single top-level `run-shell` here is the reliable "server
# just booted" event. `-b` runs it in the background so a slow gather never blocks server
# startup, and `bn startup` dedups on the tmux server PID + is a no-op off tmux, so this is
# headless-safe and never double-fires when the config is re-sourced by hand.
run-shell -b "$HOME/.config/bn/bn startup"
