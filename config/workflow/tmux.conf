#============================================================================
# TMUX CONFIGURATION
#============================================================================

#----------------------------------------------------------------------------
# Core Settings
#----------------------------------------------------------------------------

# Terminal & colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -gq allow-passthrough off

# Shell
if-shell '[ -x /bin/zsh ]' 'set-option -g default-shell /bin/zsh'

# History
set -g history-limit 100000

# Message log. It is also the only record tmux keeps of which keys were pressed (`key C-o: …`
# rows), and `bn run tmux-keylog` drains it every 5 minutes into a usage log. At the default 1000
# rows the status-bar polling (list-panes/list-windows) rolls it over in about two minutes, so most
# presses fell out before anything read them. 10000 gives the poll ~20 minutes of headroom.
set -g message-limit 10000

# Timing
set -s escape-time 0
# `display-panes-time` was here, and was dead: it only affects `display-panes`, whose default key
# `q` this config rebinds to kill-pane, and nothing else invokes it. Bind `display-panes` first if
# you want the pane-number overlay back, then set this again.

# Extended keys — distinguish C-BSpace, C-Enter, etc. from their base keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys,*-kitty:extkeys,*-ghostty:extkeys'

# OSC 8 hyperlinks. Without this feature bit tmux strips them, so the PR URL `gh pr create` prints
# — and every link an agent emits — arrives as dead text you have to retype. Also what makes
# #{mouse_hyperlink} and #{copy_cursor_hyperlink} resolve to anything.
set -as terminal-features 'xterm*:hyperlinks,*-kitty:hyperlinks,*-ghostty:hyperlinks'

# Detached sessions render at `default-size`, and bn creates several that no client ever attaches
# to — warm pool slots, the `_bn_edit` parking session. At tmux's 80x24 default
# every build and agent in them wraps at 80 columns, and the `capture-pane` previews the jump
# picker shows are 80 wide too. Size them like a real terminal instead.
set -g default-size 200x50

# Mouse
set -g mouse on

# Focus events — let nvim see focus gained/lost (autoread, autosave, gitsigns refresh)
set -g focus-events on

# Multi-client: resize to the smallest *attached* client only; stay attached
# (switch to another session) when the current session is destroyed.
set -g aggressive-resize on
set -g detach-on-destroy off

# Window/pane numbering (start at 1)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Disable visual noise
set -g visual-activity off
set -g visual-bell off

# Alerts must fire for the CURRENT window too. tmux's default `silence-action other` means "ignore
# it in the window you are looking at" — which is exactly backwards for `prefix m` (below), whose
# whole gesture is "watch THIS agent and tell me when it stops". With the default, pressing `m` on
# the window you're watching sets monitor-silence, never fires `alert-silence`, never badges ✓, and
# leaves the watch stuck on forever. Proved on a clean server: two windows, both watched, only the
# non-active one fired the hook.
set -g silence-action any
# `visual-silence` stays off on purpose: the tab badge IS the notification, and a message on top of
# it would report the same event twice.

# The bell is a job-done signal we already collect and were throwing away. Agents and build tools
# ring it on completion; tmux records it per window for free, with no hook and no 12-second silence
# guess. Both of these are tmux defaults — set explicitly because the tab formats below now depend
# on `window_bell_flag`, and a config that reads an option should say it wants it.
setw -g monitor-bell on
set -g bell-action any

#----------------------------------------------------------------------------
# Prefix & Core Bindings
#----------------------------------------------------------------------------

# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind -N "Config · reload ~/.tmux.conf" R source-file ~/.tmux.conf \; display "Config reloaded!"

# Curated keybinding cheat-sheet (overrides the default list-keys dump)
bind -N "Config · this cheat-sheet" ? display-popup -E -w 70% -h 90% "exec $SHELL -c '$HOME/.config/bn/bn tmux-help'"

# Clean up bindings that were removed (so reload re-applies cleanly)
unbind S
unbind J
unbind c
unbind C
unbind C-n
unbind C-s
unbind W
unbind N
unbind y
unbind k
unbind a
unbind i
unbind C-r
unbind C-w
unbind 0
set-hook -gu after-new-window
set-hook -gu window-renamed

# Surviving stock bindings that are actively dangerous in this layout — a window is a worktree, so
# tmux's window verbs are not the harmless things they are in a plain session.
#
# `&` is stock kill-window behind a bare y/n prompt. `x` (below) is the integrated close: it runs
# `bn wt close --check`, which is the gate that notices uncommitted work and a live agent. `&`
# skips all of it and takes the window down anyway, from the same hand position.
unbind &
# `C-z` suspends the client to the parent shell needing `fg`. With `d` rebound to the diff picker
# it is also the closest-looking "get me out of tmux" key, so it gets pressed by accident and looks
# like tmux hung. `C-d` below is the real answer.
unbind C-z
# Stock `"` and `%` split without `-c "#{pane_current_path}"`, so they open in the session's start
# directory rather than the worktree — a shell that looks right and is in the wrong repo. `v`/`s`
# (below) are the ones that keep the path.
unbind '"'
unbind %

# Detaching had NO binding at all: `d` is the worktree diff picker, and nothing else in any key
# table ran `detach-client`, so leaving tmux cleanly meant typing `:detach` at the command prompt.
bind -N "Projects · detach this client (leave tmux)" C-d detach-client

#----------------------------------------------------------------------------
# Pane Management
#----------------------------------------------------------------------------

# Splits (v=right, s=below) - keeps current path
bind -N "Panes · split right (keeps the worktree path)" v split-window -h -c "#{pane_current_path}"
bind -N "Panes · split below (keeps the worktree path)" s split-window -v -c "#{pane_current_path}"

# Pane navigation (arrow keys)
bind -N "Panes · focus left" -r Left select-pane -L
bind -N "Panes · focus down" -r Down select-pane -D
bind -N "Panes · focus up" -r Up select-pane -U
bind -N "Panes · focus right" -r Right select-pane -R

# Pane resizing (shift + arrow)
bind -N "Panes · resize left" -r S-Left resize-pane -L 5
bind -N "Panes · resize down" -r S-Down resize-pane -D 5
bind -N "Panes · resize up" -r S-Up resize-pane -U 5
bind -N "Panes · resize right" -r S-Right resize-pane -R 5

# Kill pane (with confirm) — the dumb one: leaves the worktree and its pool lease alone.
# `prefix x` is the integrated close (release the lease + drop the window).
bind -N "Panes · kill this pane (worktree + lease untouched — x is the close)" q confirm-before -p "Kill pane? (y/n)" kill-pane

# Toggle zoom
bind -N "Panes · toggle zoom" z resize-pane -Z

# Reshape: break this pane into its own window (!), or pull another window's
# pane in beside this one (@).
bind -N "Panes · break this pane into its own window" ! break-pane
bind -N "Panes · pull another window's pane in beside this one" @ choose-window 'join-pane -h -s "%%"'

#----------------------------------------------------------------------------
# Window Management
#----------------------------------------------------------------------------

# New window (keeps path)
bind -N "Windows · new window here" w new-window -c "#{pane_current_path}"

# Rename window
bind -N "Windows · rename this window" r command-prompt -p "Rename:" "rename-window '%%'"

# Direct window access
bind -N "Windows · select window 1" 1 select-window -t 1
bind -N "Windows · select window 2" 2 select-window -t 2
bind -N "Windows · select window 3" 3 select-window -t 3
bind -N "Windows · select window 4" 4 select-window -t 4
bind -N "Windows · select window 5" 5 select-window -t 5

# Previous/next window
bind -N "Windows · previous window" -r [ previous-window
bind -N "Windows · next window" -r ] next-window

# ` — switch to any window in THIS session. The third member of the jump family, and the one
#     scoped where the others are not: `prefix Tab` goes to whatever needs you next, while this
#     lists *every* window of the session you're
#     in — quiet worktrees included — because "back to the branch I was on" is navigation, not
#     triage. It is what `1`-`5` stop being able to do once a session holds more than five
#     worktrees: type a few letters of the branch instead of counting tabs.
#
#     Rows carry the same badges the tab bar draws (blockers · todos · agent state) plus a live
#     capture-pane preview the bar can't show, ordered last-used first so a bare ↵ toggles back to
#     the window you came from and never lands on the one you're already looking at. ctrl-r
#     re-reads the badges. Native `bn jump --session`.
bind -N "Windows · switch to any window in this session (badges + live preview)" ` display-popup -E -w 75% -h 65% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn jump --session'"
bind -N "Windows · find a window in this session (same picker as prefix-`)" f display-popup -E -w 75% -h 65% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn jump --session'"

# Cycle to next window (no prefix)
bind -n C-BSpace next-window

# Move windows left/right
bind -N "Windows · move this window left" -r < swap-window -t -1 \; previous-window
bind -N "Windows · move this window right" -r > swap-window -t +1 \; next-window

# Watch this window for completion. Toggling on sets monitor-silence: when the
# window's output goes quiet for 12s (build/test/agent finished), the
# alert-silence hook below badges it with a ✓ (@bn_done) and stops watching.
bind -N "Agents · watch this window — badge it done when it goes quiet" m if -F '#{monitor-silence}' \
  'setw monitor-silence 0 ; setw @bn_done "" ; display "watch off"' \
  'setw monitor-silence 12 ; setw @bn_done "" ; display "watching — quiet 12s = done"'

# When a watched window goes quiet, badge it ✓ and stop watching.
set-hook -g alert-silence 'run-shell "$HOME/.config/bn/bn tmux-done-badge #{hook_window}"'
# A pane that exits badges straight away, with its real outcome instead of the silence guess.
# `pane-died` fires when remain-on-exit keeps the pane (agent windows, failed picker commands), so its
# exit status is known and a failure gets a red mark. `pane-exited` fires when it does not, so the
# status is gone: that badges a watched window only, never a plain shell someone closed.
set-hook -g pane-died 'run-shell "$HOME/.config/bn/bn tmux-done-badge #{hook_window} --status=#{pane_dead_status}"'
set-hook -g pane-exited 'run-shell "$HOME/.config/bn/bn tmux-done-badge #{hook_window} --exited"'

#----------------------------------------------------------------------------
# Session Management
#----------------------------------------------------------------------------

# Project picker (`bn tat`, native fzf + preview). Popups run via `exec $SHELL -c`
# (non-interactive, so startup is instant) which sources .zshenv — that puts
# fzf/bn/zoxide/nvim on PATH (they live in ~/.local/bin and ~/.bin, which the tmux
# server's PATH lacks). `bn` resolves through ~/.config/bn/bn (a symlink install.sh
# points at the installed binary). Same pattern for every native popup below.
bind -N "Projects · project / worktree picker (frecency + preview)" C-o display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat'"

# Same picker, scoped to the Windows-filesystem repos (WSL drives them; root from
# ~/.config/wt/win-root).
bind -N "Projects · picker scoped to the Windows-filesystem repos" C-w display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat --root win'"

# C-j — jump to another session with tmux's own picker. No popup, no fzf, no bn: pure
#     `choose-tree`, so it still works when PATH is bare, bn is mid-reinstall, or the config is
#     loaded on a machine without the dotfiles. `-s` lists sessions (Right/Enter expands one into
#     its windows), `-Z` zooms the pane so the tree gets the full screen. In the tree: `f` filters,
#     `O` changes sort order, `x` kills the highlighted target, Enter switches.
#     Chords off the C-Space prefix without lifting Ctrl, and sits next to `bn jump` (Tab) and
#     `bn jump --session` (`) in the jump family.
# `_bn_edit` holds parked editor panes; it is storage, not a place you navigate to.
bind -N "Projects · session tree (tmux-native; f filters, x kills)" C-j choose-tree -Zs -f '#{!=:#{session_name},_bn_edit}'

# Kill session and switch to next
bind -N "Projects · kill this session, switch to the next" t run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'

# Rename current session
bind -N "Projects · rename this session" . command-prompt -p "Rename session:" "rename-session '%%'"

# Planning starts from a repository-backed worktree selected through the normal picker. Never
# create a global scratch session: it has no branch identity and races plain `tmux` startup.
bind -N "Projects · project / worktree picker" C-p display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat'"
bind -N "Projects · project / worktree picker" BSpace display-popup -E -w 80% -h 80% "exec $SHELL -c '$HOME/.config/bn/bn tat'"

#----------------------------------------------------------------------------
# Worktree Workflow (windows = worktrees)
#----------------------------------------------------------------------------

# Open worktree as window, or create it from latest main if the typed name is new.
# `-d pane_current_path` so `bn wt` resolves the current repo from cwd.
bind -N "Worktrees · open a worktree window (creates it from main if new)" o display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt open'"

# Always open a new window on a chosen worktree (never re-selects existing)
bind -N "Worktrees · always open a NEW worktree window" W display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt open --new'"

# Close all panes — kill the whole window (the bigger hammer next to q = kill pane)
bind -N "Worktrees · kill this window and all its panes (the worktree stays)" X confirm-before -p "Close window (all panes)? (y/n)" kill-window

# Pick any worktree to remove it + kill its window
bind -N "Worktrees · pick any worktree to delete" D display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn wt remove'"

# x — close THIS worktree: drop its window and reclaim it (hand its pool lease back, or run the
# cleanup gates) right here, in the backgrounded process this key spawns. The current-worktree
# sibling of D. Never closes a session: a worktree that owns its session's last window leaves that
# window respawned as a bare shell instead.
#
# `bn wt close --check` exits 0 only when the branch holds uncommitted or unpushed work, so only
# that case pays for a prompt — everything else closes on the keystroke. `if-shell` (not
# backgrounded) runs its branch in this key's own client, which is what gives confirm-before a
# client to prompt on; it can afford to block because `--check` is a handful of local git reads.
# The branch name comes from the @bn_branch window option `bn wt open` stamps; no #() in a prompt
# string (it expands asynchronously and is empty on first use). Output is redirected because
# run-shell surfaces stdout as a popup — bn reports via display-message.
#
# `run-shell -b`, because without it tmux holds the command queue until the command exits and the
# whole UI freezes for the length of the close. The reclaim (a warm reset, or the cleanup gates'
# `gh pr view` over the network) runs inside this backgrounded process. Backgrounded, the key
# returns instantly and the outcome arrives as a display-message a few seconds later; `bn wt close`
# targets every window and pane by explicit id, so it needs no client of its own.
bind -N "Worktrees · close this worktree — drop the window, reclaim it" x if-shell "$HOME/.config/bn/bn wt close --check --path '#{pane_current_path}'" \
  { confirm-before -p "#{?@bn_branch,#{@bn_branch},this worktree} has unsaved work or a live agent — close it anyway? (y/n)" \
      { run-shell -b "$HOME/.config/bn/bn wt close --pane '#{pane_id}' --path '#{pane_current_path}' --confirmed >/dev/null 2>&1" } } \
  { run-shell -b "$HOME/.config/bn/bn wt close --pane '#{pane_id}' --path '#{pane_current_path}' >/dev/null 2>&1" }

# Branch note popup
bind -N "Notes · open the branch note" n display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'"

# Quick-capture: add a todo (a) / blocker (b) without leaving the pane. The popup runs in
# the pane's cwd so bn resolves the note and refreshes the window decoration live.
bind -N "Notes · quick-add a todo" a display-popup -E -w 60% -h 20% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn add todo --prompt'"
bind -N "Notes · quick-add a blocker" b display-popup -E -w 60% -h 20% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn add blocker --prompt'"

# Attention queue: native interactive fzf picker — `bn doctor --pick` (cron failures + raised
# items + stale notes, urgent first). ↵ opens the item · ctrl-g starts its agent · ctrl-a ack ·
# ctrl-s snooze 1d · ctrl-r reload. Ported from bn-attention.sh, extending the `bn wt` native
# fzf+dispatch pattern.
bind -N "Notes · attention queue (cron failures + raised items + stale notes)" C-a display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn doctor --pick'"

# The briefings popup (`prefix B`, #265) lived here. Its binding and its backing command both went
# in #1297, the refactor that deleted the orchestrate daemon and the coaching layer — but the key's
# comment and its cheat-sheet row survived, so `prefix ?` advertised a key that did nothing at all.
# `bn feed` is what remains of that inbox, and it renders rather than picking. Nothing to bind.

# Agent cockpit. Both go through `bn agent launch` (native, ported from workflow/bin/agent):
# resume the worktree's recorded session if one exists, else start fresh — copilot by default. Auto-watched, badges ✓ when a
# window goes quiet. Run several across worktrees in parallel.
# A — spawn an agent window on this worktree (copilot, the default agent).
bind -N "Agents · spawn an agent on this worktree" A run-shell "$HOME/.config/bn/repo/config/workflow/bin/tmux-agent.sh '#{pane_current_path}'"
# G — same window, but Claude (`bn agent launch claude`, which runs it in yolo mode). This used to
#     pass copilot explicitly, which made it a byte-identical duplicate of A and left no key for the
#     harness most agent panes actually run.
bind -N "Agents · spawn a Claude agent on this worktree" G run-shell "$HOME/.config/bn/repo/config/workflow/bin/tmux-agent.sh '#{pane_current_path}' claude"
# S — orchestration roll-up: in-flight (watched/done) windows across all sessions + bn summary.
bind -N "Agents · cockpit: in-flight windows + bn summary" S display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-cockpit'"
# j — the jump picker: `bn jump`, the only surface that stacks live tmux windows needing you
#     (waiting / done / blocker badges, ranked by time-in-state, each previewing its pane via
#     capture-pane) OVER the cross-repo `bn next` queue. ↵ switches to the window, or opens
#     the queue item. Warm-cached through `next::cached_or_compute`, so the frame paints at
#     once. The natural follow-through from the attention badge: the bar says 1 waiting 2h15m,
#     `j` shows which window with its pane preview.
#     This key used to run `bn doctor --pick` — a byte-identical duplicate of `prefix C-a`,
#     which keeps the attention list. `prefix ?` has described `j` as the jump picker all
#     along; it is now true.
bind -N "Agents · jump picker — windows needing you over the bn next queue" j display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn jump'"
# Tab — fast-path: jump straight to the top-priority window needing you, no popup. Repeated
#       presses cycle through them (the one you land on drops out next time). Native
#       `bn jump --next`, ported from tmux-jump.sh.
bind -N "Agents · jump straight to the top window needing you (repeat to cycle)" Tab run-shell "$HOME/.config/bn/bn jump --next"
#----------------------------------------------------------------------------
# Nested tmux (remote hosts / codespaces / devcontainers)
#----------------------------------------------------------------------------

# `bn connect --window <alias>` creates a local `host:<alias>` session whose pane owns an SSH
# attachment to the remote `bn` tmux. Hide the outer chrome and move that session onto the empty
# `off` key table so the remote tmux receives C-Space and every other key directly. F12 is the one
# escape hatch: switch back to the previously attached cockpit session, whose hook restores the
# configured one-row status and normal root key table.
set-hook -g client-session-changed 'if -F "#{m:host:*,#{session_name}}" "set -g status off ; set key-table off" "set -g status on ; set -u key-table"'
if -F '#{m:host:*,#{session_name}}' 'set -g status off ; set key-table off' 'set -g status on ; set -u key-table'
bind -T off F12 switch-client -l

# F9 = passthrough toggle for nesting. When you SSH into a codespace that also
# runs tmux, both servers grab C-Space and the outer one wins — the inner tmux
# never sees its prefix. F9 tells THIS (outer/parent) tmux to stop handling keys:
# prefix is unset and the root table is swapped for an empty "off" table, so every
# keystroke (C-Space included) falls through to the inner tmux. The window-list
# bar turns dark red with an OFF badge as a reminder. F9 again restores control.
#
# One bare key, both directions — no prefix (the collision we're dodging) and no
# Alt (not all keyboards/terminals send it). F9 chosen over F12 (browser DevTools)
# and F5/F11 (browser reload/fullscreen), which web codespaces intercept.
#
# The OFF badge is NOT set here. It used to be written into `status-right`, which this config's
# custom `status-format` never referenced — so the one visual cue for the one mode where
# tmux ignores every key but F9 was never drawn. It is now rendered straight from
# `#{client_key_table}` in status-format[0], which is the actual state rather than a copy of it,
# and therefore cannot fall out of sync with these two bindings.
bind -T root F9 \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=colour52,fg=colour250" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F9 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

#----------------------------------------------------------------------------
# Copy Mode (vi-style)
#----------------------------------------------------------------------------

setw -g mode-keys vi

# Enter copy mode. `-e` exits automatically once you scroll back down to the live screen, which is
# what the stock WheelUpPane binding already does — without it, keyboard entry and mouse entry
# behaved differently and only the keyboard one needed `q` to get out.
bind -N "Copy mode · enter copy mode (exits at the bottom)" Space copy-mode -e

# Selection
bind -N "Copy mode · begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy mode · toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle
bind -N "Copy mode · copy selection and exit" -T copy-mode-vi y send -X copy-selection-and-cancel

# Navigation
bind -N "Copy mode · half page up" -T copy-mode-vi C-u send -X halfpage-up
bind -N "Copy mode · half page down" -T copy-mode-vi C-d send -X halfpage-down
bind -N "Copy mode · top of history" -T copy-mode-vi g send -X history-top
bind -N "Copy mode · bottom of history" -T copy-mode-vi G send -X history-bottom

# Search — `/` and `?` are deliberately NOT rebound. tmux 3.6's stock bindings are
#   command-prompt -T search -p "(search down)" { send-keys -X search-forward -- "%%" }
# and the hand-rolled versions this config used to carry were strictly worse in three ways:
# no `-T search` (so ↑ never recalled a previous search — `prompt-history-limit` exists for
# exactly this, and searching a 100k-line agent scrollback is a daily loop), no `--` (so a term
# starting with `-` was parsed as a flag), and `'%%'` single-quoted (so a term containing `'`
# broke the command). `n` / `N` are stock too.
#
# Jump between shell prompts — i.e. to the start of the previous command's output — instead of
# half-paging through a 100k-line transcript looking for where the last thing began. tmux locates
# prompts from OSC 133 marks, which the shell must emit; the matching `precmd`/`preexec` hooks
# live in the dotfiles .zshrc. Without them these two keys do nothing at all.
bind -N "Copy mode · jump to the previous shell prompt" -T copy-mode-vi [ send -X previous-prompt
bind -N "Copy mode · jump to the next shell prompt" -T copy-mode-vi ] send -X next-prompt

# OSC52: copy reaches the real clipboard through the terminal — works over SSH and
# in WSL with no X server, and from a remote session nested in a local one.
set -g set-clipboard on

# Every copy (copy-mode y, a mouse selection) also goes to this machine's clipboard through
# bn-clip, which on WSL writes the Windows clipboard directly. It used to pipe to xclip, which
# needs the WSLg bridge; that bridge stops syncing now and then, so copies landed only sometimes.
set -g copy-command "sh $HOME/.config/bn/repo/config/workflow/bin/bn-clip copy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Paste. p pastes the system clipboard (on WSL the Windows one), so what you copied anywhere is
# what comes out; P still picks from tmux's own buffers. Bracketed (-p): a TUI's input box (Claude,
# Copilot, nvim) takes a multi-line paste as one paste instead of submitting at every newline.
bind -N "Tools · paste the system clipboard" p run -b "sh $HOME/.config/bn/repo/config/workflow/bin/bn-clip paste | tmux load-buffer -b bn-clip - && tmux paste-buffer -p -d -b bn-clip -t '#{pane_id}'"
bind -N "Tools · choose a buffer to paste" P choose-buffer

#----------------------------------------------------------------------------
# Status Line
#----------------------------------------------------------------------------

# Palette — Tokyo Night (truecolor; `terminal-overrides ",*:RGB"` above makes these exact).
# Inlined as hex throughout this section (tmux can't share variables into style strings).
# Legend so a future edit keeps the bar coherent:
#   bg seg #1f2335 · divider #3b4261 · text #c0caf5 · dim #565f89
#   blue #7aa2f7 (active/branch) · cyan #7dcfff (panes/cron) · green #9ece6a (clean/done)
#   amber #e0af68 (todos/waiting) · red #f7768e (blocker/dirty) · purple #bb9af7 (goal)
# Powerline separators below are   (U+E0B0/E0B2) — they need a Nerd/powerline-patched
# font. If you see tofu boxes, swap them for plain spaces or '│'.

set -g status-interval 5
# The terminal's own title bar (the Windows Terminal tab and window title) names the machine first:
# its bn nickname (`BN_TUNNEL_NICK=<name> bn run tunnel-setup`), else its short hostname, then the
# session and window. With several machines open in tabs, the tab says which one it is.
set -g set-titles on
set -g set-titles-string "#{?#{@bn_machine},#{@bn_machine},#h} · #S:#W"
set -g status-style "bg=default,fg=#c0caf5"

#--- Pane borders --------------------------------------------------------------
# Top border doubles as a per-pane label: index:command, a zoom flag, and the path tail — so every
# pane self-documents (which command, where) without checking the bar. The host (#h) used to lead
# it; it was the same machine name on every pane, so it went.
# A pane named with prefix-C-t shows that name instead of index:command. It lives in the pane
# option @pane_name, not the pane title, because zsh, nvim and Claude Code rewrite the title.
bind -N "Panes · name this pane (empty clears)" C-t command-prompt -I "#{@pane_name}" -p "Pane name:" { if -F "#{==:%1,}" { set -pu @pane_name } { set -p @pane_name "%1" } }
bind -N "Windows · label this window (empty clears)" T command-prompt -I "#{@window_label}" -p "Window label:" { if -F "#{==:%1,}" { setw -u @window_label } { setw @window_label "%1" } }
# Only drawn once a window is split: on a single pane the row sat right under the status bar
# saying nothing the bar didn't. The layout hook flips each window's own pane-border-status as
# its pane count crosses one; the run-shell below sets the windows that already exist on reload.
# Unfocused panes sit on a darker ground with muted default text, so a split window shows where
# keystrokes land without reading the border. Only text in the terminal's DEFAULT colours dims:
# an app that paints its own background (nvim with a non-transparent theme) keeps it.
set -g window-style "fg=#737aa2,bg=#16161e"
set -g window-active-style "fg=default,bg=default"
set -g pane-border-lines single
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
run-shell -b 'tmux list-windows -a -F "#{window_id} #{window_panes}" | while read -r w n; do if [ "$n" -gt 1 ]; then tmux setw -t "$w" pane-border-status top; else tmux setw -t "$w" pane-border-status off; fi; done'
set -g pane-border-format "#[fg=#{?pane_active,#7dcfff,#3b4261}]┄ #[fg=#{?pane_active,#c0caf5,#565f89},bold]#{?@pane_name,#{@pane_name},#P#[nobold]:#{pane_current_command}}#{?window_zoomed_flag,#[fg=#e0af68]  ,} #[fg=#3b4261]#{b:pane_current_path} ┄"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"

#--- Top: one-row status line (tabs + dashboard) -------------------------------
# One full-width row at the top, regardless of how panes are split underneath:
#   • left  = session pill + window tabs, the usual list with click ranges.
#   • right = git branch · clock.
# It used to be two rows, with the branch goal (or linked PR title) filling the left of a
# dashboard row. Once the tabs shrank to numbers + badges they fit beside the dashboard, and the
# goal was the one segment not worth a second row. `bn tmux-goal` still prints it on demand.
set -g status on
# Clear the old second row so `source-file` on a running server doesn't keep drawing it.
set -gu status-format[1]
set -g status-position top
set -g status-justify left
# Emptied on purpose, and it must stay empty: tmux-continuum PREPENDS its save interpolation to
# whatever this holds (continuum.tmux:41), so blanking it first is what makes the final value be
# continuum's `#()` and nothing else. Leave it unset and the row would inherit tmux's stock
# pane-title-and-clock and render a second clock next to the real one.
#
# The other half of that mechanism was missing. A custom `status-format` only evaluates what it
# actually references, and the bar never mentioned `#{T:status-right}` — so continuum's
# interpolation was never evaluated and the 15-minute autosave never fired once. (Proof:
# `@continuum-save-last-timestamp` sat at server-start for six hours while the bar ticked every
# 5s; the only snapshots on disk came from the session-closed/window-unlinked hooks below.)
# status-format[0] now ends with `#{T:status-right}`. The script prints nothing, so it costs no
# width — it exists to be evaluated, not to be seen.
set -g status-right ""
# Left — session pill + window tabs, reusing status-left / window-status-*-format below.
# range=window|#{window_index} keeps the per-tab click targets (#{mouse_window}) working.
#
# Right — the focused pane's git segment and the clock, nothing else. `#[nolist]` closes the tab
# list first: without it the right block stays inside the list range and is packed up against the
# tabs instead of pinned to the far edge.
#
# The work tally (`bn tmux-status`), the waiting-agent bells and the date left the bar: the tab
# badges and `bn tat` already carry them, and the separators around them were mostly empty. The
# commands still work; only the bar wiring went.
#
# Overflow: when the tabs outgrow the space, tmux trims the list and draws the amber `<` / `>`
# markers on whichever side has hidden tabs. `list=focus` on the current tab keeps it on screen.
# The markers are click targets too (range=left/right, nothing else in the bar uses those ranges):
# `<` steps to the previous window, `>` to the next, and the strip scrolls with the focus.
bind -n MouseDown1StatusLeft  previous-window
bind -n MouseDown1StatusRight next-window
set -g status-format[0] "#[align=left]#{T:status-left}#[list=on align=#{status-justify}]#[list=left-marker range=left]#[fg=#e0af68]< #[norange list=right-marker range=right]#[fg=#e0af68] >#[norange list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right,bg=default]#(sh $HOME/.config/bn/repo/config/workflow/bin/tmux-tunnels.sh 2>/dev/null)#[fg=#c0caf5]#($HOME/.config/bn/bn tmux-git '#{pane_current_path}' 2>/dev/null) #[fg=#a9b1d6]%H:%M #{?#{==:#{client_key_table},off},#[fg=#1a1b26#,bg=#f7768e#,bold] OFF ,}#{T:status-right}"
# Left pill = session name, flips to reverse-video " PREFIX " while C-Space is held —
# so you always know whether tmux is listening.
set -g status-left "#[fg=#1a1b26,bg=#{?client_prefix,#e0af68,#7aa2f7},bold]  #{?client_prefix,PREFIX,#{?#{@bn_machine},#{@bn_machine} · ,}#S} #[fg=#{?client_prefix,#e0af68,#7aa2f7},bg=default,nobold] "
# Inactive tabs show just the window NUMBER + bn badges; the ACTIVE tab adds its name
# (@bn_branch, else the window name, cut to 20 columns) so you can tell where you are without
# looking right. prefix-T sets a window LABEL (@window_label) that wins over both and shows on every
# tab, active or not: a name you chose is worth its columns. It is a label, not rename-window,
# because bn matches windows by their tmux name. A name on every tab spent 20-30 columns each and overflowed the strip long before
# the windows ran out; one name is cheap. The window's tmux NAME is still the sanitized branch
# (`bn_core::orchestrate::tmux_window_name`) — dispatch lane matching, `bn tmux-reconcile`,
# `bn jump` and the tab context menu all read it. Which number is which branch: prefix-f or
# prefix-` (`bn jump --session`, badges + live preview), or right-click the tab.
# Tabs badge only what needs you: @bn_agent (Claude Code hooks) blocked · needs-decision · failed ·
# waiting · done, then @bn_done / the bell (the silence-watch fallback, see `bind m`). Busy states
# (working, limited) and the @bn_todos / @bn_blockers counts are not drawn: `bn tmux sync` still
# writes them and `bn jump` shows them, but a tab that is only busy has nothing to ask.
# Active tab = solid blue powerline pill (dark text); inactive =
# flat dim — the contrast carries "where am I" at a glance.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#737aa2,bg=default] #I#{?@window_label, #{=/20/…:#{@window_label}},}#{?#{==:#{@bn_agent},blocked},#[fg=#f7768e] ,#{?#{==:#{@bn_agent},needs-decision},#[fg=#e0af68] ,#{?#{==:#{@bn_agent},failed},#[fg=#f7768e] ,#{?#{==:#{@bn_agent},waiting},#[fg=#e0af68] ,#{?#{==:#{@bn_agent},done},#[fg=#9ece6a] ,#{?#{==:#{@bn_done},✗},#[fg=#f7768e] ,#{?#{||:#{@bn_done},#{window_bell_flag}},#[fg=#9ece6a] ,}}}}}}} "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #I #[nobold]#{=/20/…:#{?@window_label,#{@window_label},#{?@bn_branch,#{@bn_branch},#W}}}#[bold]#{?#{==:#{@bn_agent},blocked},#[fg=#3b1a22] ,#{?#{==:#{@bn_agent},needs-decision},#[fg=#7a5a10] ,#{?#{==:#{@bn_agent},failed},#[fg=#3b1a22] ,#{?#{==:#{@bn_agent},waiting},#[fg=#7a5a10] ,#{?#{==:#{@bn_agent},done},#[fg=#1e3a14] ,#{?#{==:#{@bn_done},✗},#[fg=#3b1a22] ,#{?#{||:#{@bn_done},#{window_bell_flag}},#[fg=#1e3a14] ,}}}}}}} #[fg=#7aa2f7,bg=default,nobold]"

#--- Tab right-click / double-click → action menu ------------------------------
# Anchored to the status line (-y S) so it opens UPWARD, above the cursor — otherwise the
# button-release lands on a menu item and dismisses it instantly. Targets the CLICKED tab
# via -t "#{mouse_window}", so each item acts on that window. Reuses the keyboard actions
# (n note · g lazygit · r rename · m watch · X kill). Both gestures bound since some
# terminals swallow right-click (e.g. paste-on-right-click); double-click always reaches us.
bind -n MouseDown3Status   display-menu -O -x M -y S -t "#{mouse_window}" -T "#[align=centre,fg=white,bold] #{window_name} " "Open note" n { display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'" } "Lazygit" g { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'" } "Rename window" r { command-prompt -I "#{window_name}" -p "Rename:" "rename-window -t '#{mouse_window}' '%%'" } "Watch for done" m { setw -t "#{mouse_window}" monitor-silence 12 ; setw -t "#{mouse_window}" @bn_done "" ; display "watching #{window_name}" } "" "Kill window" X { confirm-before -p "Kill #{window_name}? (y/n)" "kill-window -t '#{mouse_window}'" }
bind -n DoubleClick1Status display-menu -O -x M -y S -t "#{mouse_window}" -T "#[align=centre,fg=white,bold] #{window_name} " "Open note" n { display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c '$HOME/.config/bn/bn tmux-note'" } "Lazygit" g { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'" } "Rename window" r { command-prompt -I "#{window_name}" -p "Rename:" "rename-window -t '#{mouse_window}' '%%'" } "Watch for done" m { setw -t "#{mouse_window}" monitor-silence 12 ; setw -t "#{mouse_window}" @bn_done "" ; display "watching #{window_name}" } "" "Kill window" X { confirm-before -p "Kill #{window_name}? (y/n)" "kill-window -t '#{mouse_window}'" }

# Messages
set -g message-style "bg=default,fg=yellow"

#----------------------------------------------------------------------------
# Popups & Tools
#----------------------------------------------------------------------------

# Editor pane (nvim) — ONE persistent nvim per worktree, hidden and restored rather than
# created and destroyed. First press splits it in at 90% of this window — collapsing the
# command pane to a strip rather than killing it, since it often holds a running agent and
# the next press gives it the full width back. Second press parks
# the pane in the detached `_bn_edit` session (nvim keeps running, the shell/agent gets the
# full width back); third press joins it back with buffers, undo and LSP intact. The keymap
# inside nvim calls the same hide path, so you never have to quit to get out of the way.
#
# This replaces a `display-popup` running `nvim .`, where nvim was a child of the popup and
# the only exit was quitting it — a cold start (LSP, treesitter, buffers) on every open.
#
# Output is discarded on purpose: run-shell displays a command's stdout in view mode once it
# finishes, so any stray line would flash a pager over the session on every keypress.
bind -N "Tools · floating nvim for this worktree (toggle)" e run-shell '$HOME/.config/bn/bn edit toggle --pane "#{pane_id}" >/dev/null 2>&1'

# Show the editor AND land it on this branch's diff, with the agent terminal spawned — for
# arriving at a worktree cold and wanting to see what changed. Never parks.
bind -N "Tools · open the editor on this branch's diff" C-e run-shell '$HOME/.config/bn/bn edit land --pane "#{pane_id}" >/dev/null 2>&1'

# Worktree diff picker — the whole fleet in one list with the diff as the preview. ↵ switches to
# that worktree's window and opens Diffview in ITS editor, so LSP and gitsigns are rooted in the
# repo you are reading.
bind -N "Tools · worktree diff picker (the whole fleet, diff as preview)" d display-popup -E -w 85% -h 80% -d "#{pane_current_path}" \
    "exec $SHELL -c '$HOME/.config/bn/bn edit diff'"

# Plan-review popup — open the newest pending plan in nvim (edit + save-back), then approve /
# request-changes. Mirrors the `e` editor popup; `bn review edit` picks the newest open review.
bind -N "Tools · review the newest pending plan" E display-popup -E -w 97% -h 97% -d "#{pane_current_path}" "exec $SHELL -c 'bn review edit'"

# Lazygit
bind -N "Tools · lazygit" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "exec $SHELL -c 'lazygit'"

# Scratch shell — throwaway terminal in the current worktree, vanishes on exit.
bind -N "Tools · scratch shell in this worktree" Enter display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "exec $SHELL"

#----------------------------------------------------------------------------
# Plugins — vendored in-repo, no TPM
#----------------------------------------------------------------------------
# tmux-resurrect + tmux-continuum live under config/workflow/plugins/ (committed copies, see
# config/workflow/plugins/README.md). We source their entrypoints directly instead of running TPM,
# so a fresh machine needs no plugin manager and no network fetch — the config is fully
# self-contained. resurrect.tmux registers its own save/restore script paths as tmux options,
# which continuum then reads, so order (resurrect before continuum) is all that matters.

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'   # restore nvim via its own Session.vim

# Record only sessions that name a repository. A session is a repo and a window is a worktree; a
# session named anything else is left over from an older layout or made by hand, and resurrect will
# otherwise carry it forward forever — every save copies it, every restore brings it back, so
# killing it by hand achieves nothing. `planning` outlived the code that created it that way.
#
# Deliberately a SAVE-time filter, not a restore-time prune. It kills nothing: it only decides what
# the snapshot records, so the worst it can do is fail to restore a session after a reboot, which is
# one `C-o` to reopen. A restore-time pruner would instead be killing sessions at server boot, when
# nothing is attached and every "someone is using this" signal reads false — the guards would be
# weakest exactly when it ran. `bn tmux-prune` (manual, dry-run by default) is the one that kills.
#
# `_bn_edit` and `host:<alias>` are kept: storage and remote attachments, not work.
set -g @resurrect-hook-post-save-layout '$HOME/.config/bn/bn tmux-snapshot-filter'

# Continuum: auto-save every 15 min, auto-restore the layout on server start.
# The session-per-project / window-per-worktree layout (cwds + running programs)
# comes back after a reboot. The nvim/note popups run nvim directly (no session),
# so there's nothing extra to restore for them.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Save immediately when a session or window is destroyed. Continuum's periodic auto-save is driven
# by a #() interpolation in status-right, so it only fires while the status line is ticking — on
# WSL that stalls whenever the instance suspends, leaving the snapshot hours stale. A deletion done
# just before a suspend/reboot would otherwise be lost, and auto-restore would resurrect the
# session you just killed. These hooks capture the new state the moment it changes, so restore
# always replays what you actually left behind.
#
# Until #{T:status-right} was added to status-format[0] these hooks were not a safety net but the
# ONLY thing saving anything, and they fire on destruction alone — so a worktree window opened and
# never closed appeared in no snapshot at all. They stay: they close the suspend-before-save window
# that the periodic save cannot.
set-hook -g session-closed  'run-shell -b "~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/scripts/save.sh quiet"'
set-hook -g window-unlinked 'run-shell -b "~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/scripts/save.sh quiet"'

# Keep the HTTP MCP endpoint available before newly opened agent panes need it. The Rust command
# checks the configured opt-out and loopback port first, so repeated create/attach hooks are cheap
# and never launch another process while the managed service is already reachable.
set-hook -g session-created 'run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"'
set-hook -g client-attached 'run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"'

# Re-stamp the window → worktree link (@bn_repo/@bn_branch) and refresh the tab badges on attach.
# tmux-resurrect restores windows WITHOUT their user options — it saves only session/index/name/
# active/flags/layout — so after every restore the identity `bn wt open` stamped at creation is
# gone, and everything keyed off it (agent leases, the fleet view, the jump picker) silently falls
# back to matching window names. Attach is when a human first looks at those restored windows, and
# it is the slot already established for a cheap idempotent no-op (`tmux-mcp ensure`, above).
# The sweep writes only options whose value actually differs, so a second attach costs one
# `list-windows` and nothing more. Backgrounded and silenced for the same reasons as its
# neighbour: a hook that blocks the command queue freezes the UI, and one that prints turns
# run-shell output into a popup. `-ga` appends rather than replacing the mcp hook above.
set-hook -ga client-attached 'run-shell -b "$HOME/.config/bn/bn tmux-reconcile >/dev/null 2>&1"'

# Version-gated extras: popup borders/titles need tmux ≥ 3.4. Sourced only when the
# running server is new enough, so this config stays clean on 3.2a (unknown-option
# errors would otherwise abort the reload). Activates automatically after the 3.5a
# upgrade (see ensure_tmux_version in dotfiles).
#
# `%if` is tmux's own config conditional and `#{>=:...}` its own version comparison, evaluated
# while parsing — no shell, no `tmux -V`, no sed, no `sort -V` pipeline, and nothing to get wrong
# about how "3.10" sorts against "3.4". (`%if` itself predates 3.4, so the gate can express its own
# floor safely.)
%if "#{>=:#{version},3.4}"
source-file ~/.config/bn/repo/config/workflow/tmux-modern.conf
%endif

# Load the vendored plugins directly (keep at bottom). resurrect first so its option-registered
# save/restore script paths are set before continuum reads them. Paths resolve through the
# repo anchor (~/.config/bn/repo → the bn checkout), so this works wherever bn is installed.
run-shell '~/.config/bn/repo/config/workflow/plugins/tmux-resurrect/resurrect.tmux'
run-shell '~/.config/bn/repo/config/workflow/plugins/tmux-continuum/continuum.tmux'

# resurrect binds `prefix C-r` to restore.sh as it loads — which is why the `unbind C-r` up in the
# cleanup block achieves nothing: that runs first, the plugin re-binds afterwards. It has to be
# undone HERE, after the load.
#
# Restore replays a whole saved layout over the running session. With `@continuum-restore on` the
# restore that matters already happens automatically at server start, so the key buys nothing and
# costs a mis-typed chord after a stray prefix. `C-s` (save) is left alone: saving more often than
# necessary is harmless.
unbind C-r

# Guarantee the bn-web dashboard/MCP server is up the moment the tmux server boots. This is the
# same canonical "server just booted" signal used for `bn startup` below: the session-created /
# client-attached hooks above only cover later sessions and attaches, and a headless
# `tmux start-server` (no first session) would otherwise boot with nothing ensuring the service —
# the top-level run-shell is the one event that fires exactly once at server start on tmux 3.5a.
# `bn tmux-mcp ensure` is gated on web.tmux_mcp_autostart and a loopback port probe, so it's a
# cheap no-op when the managed service is already reachable, and `-b` keeps a slow launch from
# blocking startup.
run-shell -b "$HOME/.config/bn/bn tmux-mcp ensure >/dev/null 2>&1"

# One boot signal for the info agents' startup trigger. tmux sources this config exactly once,
# when the server is created (there is no server-started hook in tmux 3.5a, and attach/session
# hooks would fire repeatedly), so a single top-level `run-shell` here is the reliable "server
# just booted" event. `-b` runs it in the background so a slow gather never blocks server
# startup, and `bn startup` dedups on the tmux server PID + is a no-op off tmux, so this is
# headless-safe and never double-fires when the config is re-sourced by hand.
run-shell -b "$HOME/.config/bn/bn startup"

# Tunnels come back with the server: tunnel-auto re-hosts a machine that ran tunnel-host and
# reconnects one that ran tunnel-connect (windows in the `bn-tunnels` session), and leaves any
# other machine alone. Plain sh, not `bn run`, so a machine with cron off still gets it. Both jobs
# are idempotent, so re-sourcing this config by hand only re-checks them. Log:
# ~/.cache/bn/tunnel-auto.log.
# Waits 60s first so tmux-continuum's restore creates the saved sessions before tunnel-auto makes
# `bn-tunnels`: created first, it became the session the restore reused, and the `bn` agent
# windows landed in it (2026-09-27).
run-shell -b "sleep 60; sh $HOME/.config/bn/repo/config/jobs/tunnel-auto.sh"
