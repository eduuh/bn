[package]
name = "bn-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "bn_mcp"
path = "src/lib.rs"

# The per-worktree stdio launcher (`bn mcp serve` execs this): pins its `(repo, branch)` to the
# launch cwd. Sits beside `bn`.
[[bin]]
name = "bn-mcp"
path = "src/main.rs"

[dependencies]
bn-core.workspace = true
# `client` + the reqwest Streamable-HTTP client back `bn-mcp --forge-call` (forge_call.rs), the
# one place bn talks to a remote MCP server. Kept out of the `bn` binary on purpose.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true

[dev-dependencies]
bn-core = { workspace = true, features = ["test-support"] }
tempfile = "3"
