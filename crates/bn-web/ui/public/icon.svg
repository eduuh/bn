    <rect x="276" y="150" width="86" height="86" rx="18"/>
    <rect x="150" y="276" width="86" height="86" rx="18"/>
    <rect x="276" y="276" width="86" height="86" rx="18"/>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="800" fill="#e7edf4">bn</text>
