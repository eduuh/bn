# ram_total_mb = 48000

# [windows]
# worktree_dir = "C:\projects\worktree"
# [windows.personal]
# notes_root = "C:\projects\branch-notes"
# [windows.work]
# notes_root = "C:\projects\notes\bn"
# [windows.capture]
# screenshot_dir = "C:\Users\you\Pictures\Screenshots"
# gif_dir = "C:\Users\you\Pictures\ScreenToGif"

[log]
enabled = false
level = "debug"                 # debug | info | warn | error
retain_days = 14                # 0 keeps all
# dir = "/home/you/.local/state/bn/logs"  # default <state_dir>/logs

# This machine's runtime opt-ins. Without a [machines.<name>] entry bn treats the host as
# unregistered: cron_enabled_here() is false, so `bn cron register` declares nothing and no
# scheduler agent is ever written — which is how the darwin nightly-release went 8 days without
# publishing. The machine name is the one in ~/.bn/config/machine ("snapshot-host"), not the hostname.
# `queue` is a retired key (the machine queue is gone). It stays here to prove an old config that
# still carries it resolves without error.
[machines.snapshot-host]
repos = ["*"]
cron = true
queue = true
