[package]
name = "bn-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
bincode.workspace = true
gethostname.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
rusqlite.workspace = true
ureq.workspace = true
tempfile = { version = "3", optional = true }

[features]
# Exposes `bn_core::test_support` (EnvGuard/env_lock/with_* helpers) to downstream crates so
# `bn-cli` tests share the same env lock and guard. Off by default → the production `bn` binary
# never links tempfile or the test scaffolding.
test-support = ["dep:tempfile"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Self-dependency so bn-core's own integration tests can reach `bn_core::test_support` (the shared
# env lock and RAII guards). Feature unification under resolver "2" keeps `test-support` out of the
# normal build, so the shipped binary still never links tempfile or the scaffolding.
bn-core = { path = ".", features = ["test-support"] }
