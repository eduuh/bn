name: CI

on:
  # Verification is a *pull request* concern. This used to also run on every push to main,
  # re-running the whole suite against the exact commit its PR had just proved green.
  #
  # Shipping from main is a separate chain and stays that way: release-plz.yml bumps the
  # version on push to main and pushes a tag, which triggers release.yml (cargo-dist) to
  # build the artifacts and upload them to a GitHub Release. That is also the only place a
  # --release binary is actually wanted.
  pull_request:
  # Manual trigger, so any lane can be exercised on any ref without opening a PR first.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocking. This used to be advisory (`continue-on-error: true`), which meant the lane sat red
  # for months and taught everyone to read red as normal. rustfmt is deterministic and the fix is
  # one command, so there is nothing here worth being lenient about.
  #
  # Still a SEPARATE job from `test`, and that part matters: fmt drift can never abort
  # clippy/tests the way the old single sequential `fmt · clippy · test` job did (Format ran
  # first, so any drift aborted the job before Test, silently disabling test gating).
  fmt:
    name: fmt
    # Every lane floats across the pool (`CI_RUNNER` → the shared `bn-ci` label): the three
    # Fedora boxes and the mac are interchangeable for all of CI, so a job runs wherever a slot
    # frees up first rather than queueing for a Linux one while the mac sits idle.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # rust-toolchain.toml pins the version + components; `rustup show` installs it.
      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - name: Format
        run: cargo fmt --all --check

  # The real merge gate. No `needs: fmt`, so it always runs regardless of formatting.
  test:
    name: clippy · test
    # Deliberately NOT pooled. The workspace has 11 `cfg(target_os)` sites (wt_pool, machine,
    # killport, systemd, reap, worker, cockpit) and a run of platform-specific breakage to match
    # — #969 was a dead-code build error visible only under the Linux gate, #961 the macOS
    # admission gate, #949 systemd's user bus, #959 launchd hour fields. If this lane floated,
    # a green check would no longer say *which* platform it was green on and that whole class of
    # bug becomes a coin flip per run. macOS coverage belongs in an explicit, attributable lane;
    # there isn't one today.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # rust-toolchain.toml pins the version + components; `rustup show` installs it.
      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The bn-web dashboard. A PURE NODE lane: nothing under `crates/bn-web/ui` is platform-gated,
  # and nothing here needs cargo, so it skips the ~20-line Rust bootstrap entirely (~90s, down
  # from ~5min).
  #
  # This used to also `cargo build -p bn-web` to prove build.rs embedded a fresh dist/, and to run
  # Playwright e2e. Both are gone. The cargo build could never detect the regression it appeared
  # to guard — crates/bn-web/build.rs falls back to a placeholder index.html when dist/ is absent
  # and NEVER fails — and the `test` job already compiles bn-web. The e2e suite and its fixtures
  # were deleted in a055f1c, leaving playwright.config.ts importing a ./e2e/ that does not exist,
  # so the step failed on every PR regardless of content. When e2e comes back it comes back with
  # its specs; `git show a055f1c^:crates/bn-web/ui/playwright.config.ts` has the old config.
  web:
    name: web · lint + typecheck + vitest
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    defaults:
      run:
        working-directory: crates/bn-web/ui
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/bn-web/ui/package-lock.json

      - name: Install UI deps
        run: npm ci

      # Formatting first: it is the cheapest step and the one most likely to fail on a hand-edit,
      # and a `prettier --write` diff would otherwise show up as noise inside a lint failure.
      - name: Format (prettier)
        run: npm run format:check

      # Type-aware lint. Needs the TS program, so it costs about what tsc does — but it is what
      # makes rules like no-floating-promises possible, which is why the job name promises "lint".
      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build UI (tsc + vite)
        run: npm run build

  # Repo-wide structural gates that need no installed Rust toolchain — seconds, not minutes. Kept
  # separate from `test` so "you made a file bigger" never hides behind a clippy failure, and vice
  # versa.
  gates:
    name: gates · structure
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # The 1000-line never-grow ratchet. Rules and the grandfathered list: .file-size-baseline
      - name: File-size ratchet
        run: sh scripts/check-file-size.sh

      - name: Prompt-source ownership
        run: sh scripts/check-prompt-sources.sh

      - name: Installer toolchain discovery
        run: bash scripts/check-install-toolchain.sh
