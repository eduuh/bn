name: CI

on:
  # Verification is a *pull request* concern. This used to also run on every push to main,
  # re-running the whole suite against the exact commit its PR had just proved green.
  #
  # Shipping from main is a separate chain and stays that way: release-plz.yml bumps the
  # version on push to main and pushes a tag, which triggers release.yml (cargo-dist) to
  # build the artifacts and upload them to a GitHub Release. That is also the only place a
  # --release binary is actually wanted.
  pull_request:
  # Manual trigger, so the advisory macOS lane can be exercised on any ref
  # without opening a PR first.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Advisory lane: surfaces rustfmt drift without gating merges. `continue-on-error`
  # keeps a failing Format from failing the workflow run, and — crucially — this is a
  # SEPARATE job from `test`, so fmt drift can never abort clippy/tests the way the old
  # single sequential `fmt · clippy · test` job did (Format ran first, so any drift
  # aborted the job before Test, silently disabling test gating).
  fmt:
    name: fmt (advisory)
    # Every lane floats across the pool (`CI_RUNNER` → the shared `bn-ci` label): the three
    # Fedora boxes and the mac are interchangeable for all of CI, so a job runs wherever a slot
    # frees up first rather than queueing for a Linux one while the mac sits idle.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # rust-toolchain.toml pins the version + components; `rustup show` installs it.
      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - name: Format
        run: cargo fmt --all --check

  # The real merge gate. No `needs: fmt`, so it always runs regardless of formatting.
  test:
    name: clippy · test
    # Deliberately NOT pooled. The workspace has 11 `cfg(target_os)` sites (wt_pool, machine,
    # killport, systemd, reap, worker, cockpit) and a run of platform-specific breakage to match
    # — #969 was a dead-code build error visible only under the Linux gate, #961 the macOS
    # admission gate, #949 systemd's user bus, #959 launchd hour fields. If this lane floated,
    # a green check would no longer say *which* platform it was green on and that whole class of
    # bug becomes a coin flip per run. macOS coverage belongs in the explicit `mac` lane below,
    # where its result is attributable.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # rust-toolchain.toml pins the version + components; `rustup show` installs it.
      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Separate lane so a flaky shell harness never blocks the fast rust gate above.
  integration:
    name: shell harnesses
    # Pinned too, for a different reason: `Verify harness dependencies` asserts a specific
    # toolchain (nvim) that is only known-good on the Fedora image. Pooling this
    # is the obvious next step once those deps are verified on darwin — it is the slowest lane
    # (~10 min), so it is where a fourth box would buy the most.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      - name: Verify harness dependencies
        run: |
          for command in nvim; do
            command -v "$command" >/dev/null || {
              echo "::error::$command is required on every CI runner (Fedora and darwin alike)"
              exit 1
            }
          done

      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      # The nvim specs drive target/debug/bn and nothing else, so build just that crate: the
      # workspace build also compiles bn-web (axum/tower) and bn-mcp, which no harness here
      # touches. The release build that used to follow was pure waste — 365s of the lane's
      # 454s producing a binary the nvim specs never open. Release binaries are the release
      # chain's job (release-plz tags main -> cargo-dist uploads).
      - name: Build bn
        run: cargo build -p bn-cli

      # nvim cockpit specs: headless plenary suite over nvim/tests/. The runner
      # clones plenary on first use (network is available here); neovim is already
      # installed above. Fails the job on any failing spec.
      - name: nvim cockpit specs
        run: bash nvim/tests/run.sh

  # The bn-web dashboard: unit (vitest) + end-to-end (Playwright) over the real server (#479/#477).
  # Isolated lane so a browser flake never blocks the rust gate. Builds the UI, embeds it into a
  # debug bn-web, then drives the built dashboard headless against seeded fixtures (globalSetup
  # boots the server; a stub `bn` stands in for tmux/git/gh), asserting every orchestration flow.
  web-e2e:
    name: web · vitest + playwright
    # Also floats: nothing under `crates/bn-web/ui` is platform-gated, and the whole chain here
    # (npm ci → vitest → vite build → cargo build -p bn-web → playwright chromium → e2e against
    # the seeded server) was run end-to-end on the darwin box before this landed. At ~5 min it is
    # the second-slowest lane, so letting it take the idle mac is where pooling actually pays.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    defaults:
      run:
        working-directory: crates/bn-web/ui
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/bn-web/ui/package-lock.json

      - name: Install Rust toolchain
        run: |
          # The Fedora self-hosted runners share $HOME (/home/me). A shared
          # CARGO_HOME/RUSTUP_HOME lets concurrent jobs on different runners
          # reinstall rustup and the pinned toolchain into the same tree at
          # once, deleting rustc out from under a sibling build ("could not
          # execute process .../rustc (never executed): No such file or
          # directory"). Isolate the toolchain state per runner.
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - name: Install UI deps
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build UI
        run: npm run build

      # Build the server AFTER the UI so build.rs embeds the freshly-built dist.
      - name: Build bn-web (embeds the UI)
        run: cargo build -p bn-web
        working-directory: .

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E (Playwright, headless)
        run: npm run e2e
