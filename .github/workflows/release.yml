name: Release

# Strict release. Every commit that lands on `main` goes through exactly one chain:
#
#   CI (this file calls ci.yml) -> build every platform -> publish ONE versioned GitHub Release
#
# The three properties that make it "strict", each enforced by a `needs:` edge below:
#
#   1. Nothing is published unless CI is green on the *merged* commit. A squash merge rewrites
#      the commit, so the SHA a PR proved green is not the SHA that lands here; the gate re-runs
#      against what is actually about to ship.
#   2. Nothing is published unless EVERY platform built. A partial release is worse than none —
#      it hands one machine a new bn while another silently keeps an old one, which is precisely
#      the drift the retired per-host `nightly` rolling tag produced (darwin assets sat two days
#      behind linux because a laptop cron, not CI, was the only thing that built them).
#   3. No machine ever compiles bn to install it. install.sh downloads these assets and nothing
#      else; a cargo build is for developing bn, never for running it.
#
# Versioning: the git TAG is the source of truth, never a commit. This workflow computes the next
# version and passes it to the build as `BN_RELEASE_VERSION` (see crates/bn-cli/build.rs), so CI
# never pushes a version-bump commit back to main. A bump commit would re-trigger this workflow,
# which would bump again, forever. Cargo.toml's workspace version is the *floor*: raise it in an
# ordinary PR to cut a minor or major, and patches flow from the tags on their own.
#
# This replaces two overlapping mechanisms that both claimed to ship bn: the cargo-dist workflow
# driven by release-plz bump PRs, and the rolling `nightly` tag published per-host by
# config/jobs/nightly-release.sh. See docs/releases.md.

on:
  push:
    branches:
      - main
  # Re-cut the release for main's current head without a merge (a runner that was offline when
  # the merge landed, or an asset upload that failed after the tag went out).
  workflow_dispatch:

permissions:
  contents: write

# Releases are strictly serial. Two runs racing would compute the same next version from the same
# latest tag and then fight over creating it. Never cancel a run in progress: a cancelled publish
# can leave a tag pushed with no assets behind it.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- gate ---------------------------------------------------------------------------------
  # The merge gate, and deliberately not a copy of it: this calls ci.yml, so "passed CI" means
  # the same fmt / clippy / test / web / gates / e2e jobs a pull request faces.
  ci:
    name: gate
    uses: ./.github/workflows/ci.yml

  # --- version ------------------------------------------------------------------------------
  # Decide what this release is called, and whether there is anything to release at all.
  version:
    name: version
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          # Tags are the version store, so a shallow clone would compute v0.0.1 every time.
          fetch-depth: 0
          fetch-tags: true
          set-safe-directory: false

      - name: Compute the next version
        id: next
        shell: bash
        run: |
          set -euo pipefail

          # The floor: Cargo.toml's workspace version. Raising it in a PR is how a minor/major
          # is cut; it is never lowered by this job and never written back.
          floor=$(awk '/^\[workspace\.package\]/ { in_section = 1; next }
                       /^\[/ { in_section = 0 }
                       in_section && /^version *=/ { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          if [ -z "$floor" ]; then
            echo "::error::cannot read the workspace version from Cargo.toml" >&2
            exit 1
          fi

          # The newest release we have already cut. `--sort=-v:refname` orders numerically, so
          # v0.10.0 correctly beats v0.9.0 (a lexical sort would not).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          [ -n "$latest" ] || latest="0.0.0"

          # An already-tagged commit has already been released. Re-running (a manual dispatch,
          # a re-run of a merge) must not cut a second version for identical source.
          if existing=$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*' | head -n1) &&
             [ -n "$existing" ]; then
            echo "$GITHUB_SHA is already released as $existing — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # next = max(floor, latest + one patch). The floor wins only when it is genuinely
          # ahead, so an un-bumped Cargo.toml simply means "keep taking patches".
          IFS=. read -r lmaj lmin lpat <<<"$latest"
          bumped="$lmaj.$lmin.$((lpat + 1))"
          newest=$(printf '%s\n%s\n' "$floor" "$bumped" | sort -V | tail -n1)
          if [ "$newest" = "$floor" ] && [ "$floor" != "$bumped" ]; then
            next="$floor"
          else
            next="$bumped"
          fi

          echo "floor=$floor latest=v$latest -> releasing v$next"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # --- build --------------------------------------------------------------------------------
  # One leg per platform bn is installed on. `fail-fast: false` so a broken platform reports its
  # own error instead of being cancelled by a sibling — but publish still requires all of them.
  build:
    name: build (${{ matrix.target }})
    needs:
      - ci
      - version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            # The only macOS runner is the self-hosted one; GitHub-hosted macOS minutes bill at
            # 10x on a private repo.
            runs-on: '["self-hosted","macOS","ARM64","bn-ci"]'
            # No dependency cache: this runner keeps its workspace between runs, so `target/`
            # is already warm and sccache (scripts/rustc-wrapper) is installed on it. Uploading
            # a multi-GB `target/` to the Actions cache on every merge would be slower than the
            # build it is meant to save.
            cache: false
          - target: x86_64-unknown-linux-gnu
            # 22.04, not latest: a binary linked against a newer glibc fails on older machines
            # before the installer can even print `bn --version`. The oldest glibc we build
            # against is the oldest machine bn can be installed on, so this pin is the support
            # floor, not an accident of when the file was written.
            runs-on: '"ubuntu-22.04"'
            # GitHub-hosted: a fresh VM every run, so without this the release recompiles every
            # third-party crate from scratch on every merge to main. Only the workspace's own
            # crates genuinely change per merge; the ~400 dependencies below them do not.
            cache: true
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          set-safe-directory: false

      # rust-toolchain.toml pins the version + components; `rustup show` installs it.
      # Toolchain state is per-runner: self-hosted runners can share $HOME, and a shared
      # CARGO_HOME lets two concurrent jobs reinstall the toolchain into the same tree at once,
      # deleting rustc out from under a sibling build.
      - name: Install Rust toolchain
        shell: bash
        run: |
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            # A rustup install whose own binary went missing leaves every shim behind as a
            # dangling symlink, so `command -v cargo` succeeds against a broken file. Clear them
            # before reinstalling rather than layering a new rustup over the wreckage.
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      # Restore the compiled dependency graph. Keyed on Cargo.lock, so a lockfile change is the
      # only thing that forces a full rebuild; `restore-keys` still gives a partial hit when it
      # does, rather than falling all the way back to cold.
      #
      # `target/dist` only — not all of `target/` — because that is the single profile this job
      # builds, and caching the others would pay upload cost for artifacts nothing here reads.
      - name: Cache cargo dependencies
        if: matrix.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/dist
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build release binaries
        shell: bash
        env:
          # The version this binary will report. Without it the build falls back to Cargo.toml's
          # floor, and every released bn would claim the same version.
          BN_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # `dist`, not `release`: same optimisation, thin LTO instead of fat. The release
          # profile funnels the whole workspace through one codegen unit and one LLVM thread,
          # which is minutes of link time per platform on every merge for a binary that starts
          # just as fast. See [profile.dist] in Cargo.toml.
          cargo build --locked --profile dist --workspace --bins

      # cargo-dist's layout, kept because install.sh and every existing release already speak it:
      # one `<app>-<target>.tar.xz` per binary package, each holding a single
      # `<app>-<target>/` directory with the binary inside.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          out="$RUNNER_TEMP/release-assets"
          stage="$RUNNER_TEMP/release-stage"
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage"

          # Discover binaries from cargo metadata rather than hardcoding a list, so a new binary
          # target in the workspace is published without anyone remembering to edit this file.
          bins=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] as $package
                   | $package.targets[]
                   | select(.kind | index("bin"))
                   | [$package.name, .name] | @tsv')
          [ -n "$bins" ] || { echo "::error::the workspace has no binary targets" >&2; exit 1; }

          while IFS=$'\t' read -r package binname; do
            # A package with several binaries would collide on `<package>-<target>`; qualify
            # those with the binary name and leave the common single-binary case alone.
            count=$(printf '%s\n' "$bins" | awk -F'\t' -v p="$package" '$1 == p { n++ } END { print n + 0 }')
            if [ "$count" -eq 1 ]; then app="$package"; else app="$package-$binname"; fi
            bin="target/dist/$binname"
            [ -x "$bin" ] || { echo "::error::$bin missing after the build" >&2; exit 1; }
            mkdir -p "$stage/$app-$target"
            cp "$bin" "$stage/$app-$target/$binname"
            tar -cJf "$out/$app-$target.tar.xz" -C "$stage" "$app-$target"
          done <<<"$bins"

          # One checksum file per target, so the two platforms' files never collide when every
          # leg's artifacts are merged into one directory for the release.
          ( cd "$out" && shasum -a 256 ./*.tar.xz > "checksums-$target.txt" && ls -l )
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # Smoke test: prove the thing we are about to publish actually runs, and reports the
      # version we told it to. A binary that cannot exec on its own build host will not exec on
      # anyone else's, and this is the last point where that costs nothing to find out.
      - name: Verify the built binary
        shell: bash
        run: |
          set -euo pipefail
          got=$(./target/dist/bn --version)
          echo "$got"
          case "$got" in
            *"${{ needs.version.outputs.version }}"*) ;;
            *) echo "::error::built bn reports '$got', expected version ${{ needs.version.outputs.version }}" >&2
               exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

  # --- publish ------------------------------------------------------------------------------
  # The single point where a release becomes visible. `needs: build` with no `always()` is what
  # makes property 2 above real: if any platform leg failed or was skipped, this never runs and
  # no tag is created, so main is simply un-released until it is fixed.
  publish:
    name: publish
    needs:
      - version
      - build
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","bn-ci"]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          fetch-depth: 0
          fetch-tags: true
          set-safe-directory: false

      - name: Collect every platform's assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          ls -l assets

          # Tag the exact commit CI passed on. `--tag` before the release so a failed upload
          # leaves a tag we can re-dispatch against, never a release row with no source.
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          git push origin "refs/tags/$TAG"

          # Built line by line rather than from a heredoc: a heredoc indented to sit inside this
          # YAML block scalar keeps that indentation in its output, and four leading spaces turn
          # every line of the release notes into a Markdown code block.
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Built from `main` @ `%s` after the full CI gate passed on that commit.\n\n' \
              "$(git rev-parse --short "$GITHUB_SHA")"
            printf 'Every asset below was built in this one run. A release exists only when every\n'
            printf 'platform succeeds, so each machine installs the same commit.\n\n'
            # Listed from what was actually uploaded, never hardcoded: a release that quietly
            # lost a platform must not still claim to ship it.
            for asset in assets/*.tar.xz; do
              printf -- '- `%s`\n' "$(basename "$asset")"
            done
            printf '\nInstall or update:\n\n'
            printf '    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh\n\n' \
              "$GITHUB_REPOSITORY"
            printf 'Machines never compile bn — `install.sh` downloads these assets from `releases/latest`.\n'
          } > "$notes"

          # `--latest` is stated, not inferred. gh's default picks by date and semver, which is
          # right today but silently hands the badge elsewhere the moment an old tag is re-cut.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes" \
            --latest \
            --verify-tag \
            assets/*

          echo "published $TAG"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
