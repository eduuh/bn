name: Actions cleanup

# Prune GitHub Actions storage so the account-level storage quota can't creep back up
# and freeze every runner (the failure mode behind #469: jobs dying in ~1s with no logs
# once Actions storage/spend is exhausted). Deletes workflow-run artifacts and caches
# older than a retention window. Runs on a schedule and can be triggered by hand.

on:
  schedule:
    # 04:17 UTC daily — off-peak, avoids the top-of-hour cron stampede.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      artifact_age_days:
        description: "Delete workflow-run artifacts older than this many days"
        default: "7"
        required: false
      cache_age_days:
        description: "Delete caches older than this many days"
        default: "7"
        required: false

# Only one cleanup at a time; a superseded run has nothing unique to finish.
concurrency:
  group: actions-cleanup
  cancel-in-progress: true

permissions:
  actions: write # required to delete artifacts and caches

jobs:
  cleanup:
    name: prune old artifacts + caches
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","Linux","X64","fedora"]') }}
    steps:
      - name: Delete old artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_AGE_DAYS: ${{ github.event.inputs.artifact_age_days || '7' }}
          CACHE_AGE_DAYS: ${{ github.event.inputs.cache_age_days || '7' }}
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          artifact_cutoff=$(( now - ARTIFACT_AGE_DAYS * 86400 ))
          cache_cutoff=$(( now - CACHE_AGE_DAYS * 86400 ))

          echo "Repo: $REPO"
          echo "Deleting artifacts older than ${ARTIFACT_AGE_DAYS}d, caches older than ${CACHE_AGE_DAYS}d"

          # --- Artifacts -------------------------------------------------------
          # Paginate through every artifact; delete the ones past the cutoff.
          gh api --paginate "repos/$REPO/actions/artifacts" \
            --jq '.artifacts[] | [.id, .created_at, .name] | @tsv' \
            | while IFS=$'\t' read -r id created name; do
                created_ts=$(date -u -d "$created" +%s)
                if [ "$created_ts" -lt "$artifact_cutoff" ]; then
                  echo "  artifact: deleting #$id '$name' (created $created)"
                  gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null || true
                fi
              done

          # --- Caches ----------------------------------------------------------
          # Paginate through every cache entry; delete the ones past the cutoff.
          gh api --paginate "repos/$REPO/actions/caches" \
            --jq '.actions_caches[] | [.id, .created_at, .key] | @tsv' \
            | while IFS=$'\t' read -r id created key; do
                created_ts=$(date -u -d "$created" +%s)
                if [ "$created_ts" -lt "$cache_cutoff" ]; then
                  echo "  cache: deleting #$id '$key' (created $created)"
                  gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true
                fi
              done

          echo "Cleanup complete."
