name: Rolling release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Only the newest main commit should publish this platform's rolling assets.
concurrency:
  group: rolling-release-main
  cancel-in-progress: true

jobs:
  publish:
    name: build · test · publish nightly
    # Build GNU/Linux on an older supported glibc baseline instead of the Fedora release host.
    # A Fedora-linked binary currently requires glibc 2.39 and fails on Ubuntu 22.04 dotfiles
    # installs before the installer can even print `bn --version`.
    runs-on: ${{ fromJSON(vars.ROLLING_RELEASE_RUNNER || '"ubuntu-22.04"') }}
    steps:
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          fetch-depth: 0
          set-safe-directory: false

      - name: Install Rust toolchain
        run: |
          state="$HOME/ci-rust/$RUNNER_NAME"
          mkdir -p "$state/cargo/bin" "$state/rustup"
          echo "CARGO_HOME=$state/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$state/rustup" >> "$GITHUB_ENV"
          export CARGO_HOME="$state/cargo" RUSTUP_HOME="$state/rustup"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            for proxy in "$CARGO_HOME/bin"/*; do
              if [ -L "$proxy" ] && [ ! -e "$proxy" ]; then
                rm -f "$proxy"
              fi
            done
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/bn-web/ui/package-lock.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BN_MAIN_WORKTREE: ${{ github.workspace }}
          BN_CONFIG_DIR: ${{ runner.temp }}/bn-config
        run: sh config/jobs/nightly-release.sh
