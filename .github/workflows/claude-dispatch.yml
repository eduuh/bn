# claude-dispatch — remote GitHub agent dispatch (bn issue #280).
#
# Turns a manual `workflow_dispatch` (or `gh workflow run claude-dispatch.yml`) into a Claude
# Code agent run that commits to a fresh branch and terminates in a DRAFT pull request.
#
# ── SECURITY ────────────────────────────────────────────────────────────────────────────────
# `workflow_dispatch` can only be triggered by users with write access to this repo, so the
# `prompt` input is OPERATOR-AUTHORED and trusted. Do NOT extend this workflow to fork-driven
# events (`pull_request_target`, or `issue_comment`/`pull_request` from forks): those run text an
# external attacker controls, and with the `contents: write` + secret access below that is a
# prompt-injection + secret-exfiltration surface. Keep the ONLY trigger `workflow_dispatch`.
# See the #279 spike (branch note remote-gh-spike.md) for the full threat model.
#
# Managed by `bn remote init` — re-running it overwrites this file. Edit the source in the bn repo
# (.github/workflows/claude-dispatch.yml), not the scaffolded copy.

name: claude-dispatch

# Echo bn's correlation token into the run name so `bn dispatch --remote` can identify THIS run
# deterministically (`gh run list` → match on name), instead of guessing "newest run wins" — which
# is wrong under any concurrency (#279 spike). Empty for manual UI/CLI triggers; harmless then.
run-name: claude-dispatch ${{ inputs.corr }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for the Claude agent (operator-authored — trusted input)."
        required: true
        type: string
      base_branch:
        description: "Branch to base the agent's work on. Empty = the repo's default branch."
        required: false
        type: string
        default: ""
      corr:
        description: "Correlation token bn embeds in the run name to track this run. Set by `bn dispatch --remote`; leave blank for manual triggers."
        required: false
        type: string
        default: ""

# Spike-verified permissions floor (#279 finding #3). contents+pull-requests let the agent commit
# and the follow-up step open the PR; issues:read lets the seed pull issue context; id-token:write
# is required by the action's default GitHub-App/OIDC auth path ("Why am I getting OIDC errors").
permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

# One dispatch at a time per ref: serialising keeps concurrently-generated branches from racing.
# We never cancel a run in flight — an interrupted agent leaves a half-pushed branch.
concurrency:
  group: claude-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","Linux","X64","fedora"]') }}
    steps:
      # Resolve the base branch once: the explicit input, else this repo's default branch. Reused
      # by the checkout, the action, and the PR step so all three agree on the base.
      - name: Resolve base branch
        id: base
        env:
          INPUT_BASE: ${{ inputs.base_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${INPUT_BASE:-$DEFAULT_BRANCH}"
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Checkout base
        uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          ref: ${{ steps.base.outputs.ref }}
          fetch-depth: 0
          set-safe-directory: false

      # Automation mode: a `prompt` on a non-comment event runs immediately (no @claude needed).
      # The action commits and PUSHES a generated branch but does NOT open a PR (#279 finding #1);
      # its `branch_name` output is how the follow-up step finds that branch.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ steps.base.outputs.ref }}
          prompt: ${{ inputs.prompt }}

      # The action does not open a PR, so bn's workflow does (#279 finding #1). DRAFT, from the
      # action's pushed branch, linking back to this run. Skipped when the agent produced no branch
      # (the "green-but-no-PR" case — nothing to review). PROMPT is passed via env, never
      # interpolated into the shell, so a prompt with quotes/newlines can't break or inject.
      - name: Open draft PR
        if: ${{ steps.claude.outputs.branch_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ steps.base.outputs.ref }}
          PROMPT: ${{ inputs.prompt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A concise, single-line title from the prompt's first line, capped so long prompts
          # don't produce an unwieldy PR title.
          title="claude-dispatch: $(printf '%s' "$PROMPT" | head -n1 | cut -c1-60)"
          body="$(printf 'Automated draft PR from the claude-dispatch workflow.\n\nTriggering run: %s\n\n---\n\nPrompt:\n\n%s\n' "$RUN_URL" "$PROMPT")"
          if ! gh pr create --draft --base "$BASE" --head "$BRANCH" --title "$title" --body "$body"; then
            echo "::notice::gh pr create skipped — branch '$BRANCH' may already have an open PR."
          fi
