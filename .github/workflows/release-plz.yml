name: Release-plz

# Auto-release on merge to main. On every push to `main`:
#   * release-pr opens/updates a "release PR" that bumps the shared workspace version and
#     regenerates the changelog from the merged commits, via `scripts/release-pr.py`. (This was
#     `release-plz release-pr` until it proved unusable here — see the job's own comment.)
#   * release-plz-release publishes: when a release PR has been merged (so main carries a
#     version with no matching tag yet) it pushes a single `v{version}` git tag.
# That tag push triggers the tag-driven cargo-dist `release.yml`, which builds + publishes
# the GitHub Release. release-plz is idempotent — it no-ops when there is nothing
# releasable and never re-tags an already-released version — so there is no release loop.
#
# See release-plz.toml (git-only mode, single `v{version}` tag, cargo-dist owns the
# GitHub Release) and the "Releases" section of README.md.

on:
  push:
    branches: [main]

# The workflow's own token only needs read access; the write-scoped work below runs with
# RELEASE_PLZ_TOKEN (a PAT) so the pushed tag actually triggers the cargo-dist release.yml —
# GitHub suppresses workflow triggers for pushes made with the default GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Publish: create + push the single `v{version}` tag once a release PR has merged.
  release-plz-release:
    name: release-plz release
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","Linux","X64","fedora"]') }}
    # The release automation is only meaningful on the canonical repo, never in forks.
    if: ${{ github.repository_owner == 'eduuh' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      # Match the pinned toolchain (rust-toolchain.toml), like ci.yml, so any cargo call
      # release-plz makes uses the same rustc as the rest of CI.
      - name: Install Rust toolchain
        run: |
          mkdir -p "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A PAT (NOT the default GITHUB_TOKEN) so the `v{version}` tag release-plz pushes
          # triggers the tag-driven cargo-dist release.yml. Without it the tag lands but no
          # release is ever built. No CARGO_REGISTRY_TOKEN: git-only mode never publishes.
          # Falls back to the default token so the job doesn't crash if the PAT isn't set;
          # in that case cargo-dist won't be triggered by the pushed tag.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

  # Prepare: open/update the release PR (version bump + changelog) for the next release.
  #
  # This used to be `release-plz release-pr`. It could never work here: release-plz determines the
  # next version by running `cargo package` on the tree at the last released tag, and this
  # workspace is unpackageable by design — bn-core/bn-cli `include_str!` repo-root files
  # (config/config.toml, config/skills/staff/*.md, config/workflow/tmux.conf,
  # config/prompts/quarter-review.md) that cannot live inside a crate tarball. bn is a single-repo
  # private tool that never publishes to a registry
  # (release-plz.toml: `git_only = true`), so that requirement will never be satisfiable.
  #
  # Concretely: the v0.2.0 tag predates the explicit internal dependency versions added in #983,
  # and a tag is immutable, so #983's fix could never reach the tree release-plz actually packaged
  # — every run failed from that tag onward. `scripts/release-pr.py` does the same job from
  # conventional commits, with no packaging step. The `release-plz release` job above is untouched:
  # it pushes the tag and never packages.
  release-pr:
    name: release PR
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","Linux","X64","fedora"]') }}
    if: ${{ github.repository_owner == 'eduuh' }}
    permissions:
      contents: write
      pull-requests: write
    # Never let two overlapping main pushes cut competing release PRs.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home-${{ github.job }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-${{ github.job }}
        with:
          # Full history: the next version and the changelog are both derived from the commits
          # since the last `v*` tag.
          fetch-depth: 0
          # A PAT (not the default token) so the push opens a PR whose CI checks actually run —
          # GitHub suppresses workflow triggers for pushes made with GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          set-safe-directory: false

      - name: Install Rust toolchain
        run: |
          mkdir -p "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none --no-modify-path
          fi
          rustup show

      - uses: Swatinem/rust-cache@v2

      # Bumps [workspace.package].version + the internal dep pins, refreshes Cargo.lock, and
      # prepends a CHANGELOG section. Prints nothing when the window holds nothing releasable
      # (a run of pure chore/docs/ci commits), which makes the rest of this job a no-op.
      - name: Prepare the version bump and changelog
        id: prep
        run: |
          version="$(python3 scripts/release-pr.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "next release: v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nothing releasable since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the release PR
        if: ${{ steps.prep.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always rebuild the branch from the current main, so a re-run replaces the previous
          # proposal instead of stacking a second bump on top of it.
          git checkout -B release-pr
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git push --force origin release-pr

          # The push updates an already-open PR on its own; only create one when none exists.
          body="$(printf '%s\n' \
            "Version bump + changelog for \`v${VERSION}\`, prepared by \`scripts/release-pr.py\`." \
            "" \
            "Merging this pushes the \`v${VERSION}\` tag (the \`release-plz release\` job), which triggers the cargo-dist \`release.yml\` to build and publish the GitHub Release.")"

          if [ -z "$(gh pr list --head release-pr --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head release-pr \
              --title "chore: release v${VERSION}" --body "$body"
          else
            gh pr edit release-pr --title "chore: release v${VERSION}" --body "$body"
          fi
