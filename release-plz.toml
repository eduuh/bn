# release-plz config — automated release-on-merge (see .github/workflows/release-plz.yml
# and the "Releases" section of README.md).
#
# Flow: on every push to `main`, `scripts/release-pr.py` opens/updates a "release PR" that
# bumps the shared workspace version and regenerates the changelog from the merged commits.
# Merging that PR pushes a single `v{version}` git tag, which triggers the tag-driven
# cargo-dist `release.yml` to build + publish the GitHub Release. Both halves are idempotent —
# they no-op when there is nothing releasable and never re-release an already-tagged version,
# so there is no release loop.
#
# Only the `release` command still runs from this config. The `release-pr` half was replaced
# because release-plz derives the next version by running `cargo package` on the tree at the
# last released tag, and this workspace can never be packaged: bn-core/bn-cli `include_str!`
# repo-root files that cannot live inside a crate tarball. That is fine for a tool which never
# publishes to a registry, but it made `release-plz release-pr` fail on every run. `release`
# never packages, so the settings below still apply to it unchanged.
#
# bn is an internal tool that is NOT published to crates.io, so we run in git-only mode
# (versions are derived from git tags, never `cargo publish`) and let cargo-dist — not
# release-plz — create the GitHub Release, so the build/publish is never duplicated.

[workspace]
# Private tool: derive the current version from git tags, not the cargo registry.
git_only = true
# ...and never run `cargo publish`. `git_only` only governs where versions come FROM — it does not
# suppress publishing, which is why the first release that actually had something to ship died on
# `no token found, please run cargo login`. Until v0.3.0 every run was a no-op, so the publish step
# was never reached and this was never noticed. bn ships via cargo-dist, never to crates.io, and
# the workspace could not be published even if we wanted to: bn-core/bn-cli `include_str!`
# repo-root files that cannot live inside a crate tarball.
publish = false
# cargo-dist owns the GitHub Release (built from the pushed tag). Don't let release-plz
# create one too, or every release would be published twice.
git_release_enable = false
# Lockstep workspace: disable per-crate tags by default so the whole workspace releases
# under ONE tag. bn-cli (below) re-enables tagging to drive that single tag.
git_tag_enable = false
# The unified tag name shared by every crate — matches cargo-dist's `release.yml` trigger
# (`**[0-9]+.[0-9]+.[0-9]+*`) and the existing `v0.2.0`-style tags.
git_tag_name = "v{{ version }}"
# No crates.io baseline to diff against, so skip the (library-only) semver-check gate.
semver_check = false

# bn-cli owns the `bn` binary and drives the single workspace-wide tag.
[[package]]
name = "bn-cli"
git_tag_enable = true
version_group = "bn"

# The remaining crates share bn-cli's version (lockstep) but never get their own tag.
[[package]]
name = "bn-core"
version_group = "bn"

[[package]]
name = "bn-mcp"
version_group = "bn"

[[package]]
name = "bn-web"
version_group = "bn"
