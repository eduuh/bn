[workspace]
resolver = "2"
members = ["crates/bn-core", "crates/bn-cli", "crates/bn-mcp", "crates/bn-web"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT"
repository = "https://github.com/eduuh/bn"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
checked_conversions = "deny"
dbg_macro = "deny"
large_stack_arrays = "deny"
mem_forget = "deny"
needless_collect = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
todo = "deny"
unimplemented = "deny"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# release.yml is intentionally customized to use the Fedora self-hosted runner.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[workspace.dependencies]
bn-core = { path = "crates/bn-core", version = "0.5.0" }
bn-mcp = { path = "crates/bn-mcp", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
dirs = "5"
bincode = "1.3"
netstat2 = "0.11"
notify = "8"
gethostname = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rmcp = { version = "1", features = ["server", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Decodes the task attachments the dashboard inlines into its create/upload requests, so a capture
# and its files land in one atomic call. Already in the tree transitively; named here so the
# version is the workspace's decision.
base64 = "0.22"

# Optimize from-source installs (`cargo build --release`, Codespaces, BN_BUILD_FROM_SOURCE):
# fat LTO + single codegen unit for a tight, fast-starting CLI; strip symbols and abort on
# panic to roughly halve binary size. Released artifacts inherit this via [profile.dist].
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with. Overrides to thin LTO to keep release-CI link time
# down; still inherits strip/panic/codegen-units from [profile.release].
[profile.dist]
inherits = "release"
lto = "thin"
